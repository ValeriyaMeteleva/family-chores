<!doctype html>
<html>
  <head>
    <base target="_top">
    <meta charset="utf-8">
  </head>
  <body>
    <script>
      "use strict";

      const ALLOWED_ORIGINS = new Set([
        "https://valeriyameteleva.github.io",
        "http://127.0.0.1:8765",
        "http://localhost:8765"
      ]);

      window.addEventListener("message", event => {
        if (event.source !== window.parent || !ALLOWED_ORIGINS.has(event.origin)) return;
        const message = event.data;
        if (!message || typeof message.id !== "string" || typeof message.action !== "string") return;

        google.script.run
          .withSuccessHandler(result => {
            window.parent.postMessage({ id: message.id, ok: true, result }, event.origin);
          })
          .withFailureHandler(error => {
            window.parent.postMessage({
              id: message.id,
              ok: false,
              error: error && error.message ? error.message : "Ошибка серверного запроса."
            }, event.origin);
          })
          .apiDispatch(message.action, message.payload || {});
      });

      window.parent.postMessage({ type: "family-chores-bridge-ready" }, "https://valeriyameteleva.github.io");
      window.parent.postMessage({ type: "family-chores-bridge-ready" }, "http://127.0.0.1:8765");
      window.parent.postMessage({ type: "family-chores-bridge-ready" }, "http://localhost:8765");
    </script>
  </body>
</html>

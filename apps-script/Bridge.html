<!doctype html>
<html>
  <head>
    <base target="_top">
    <meta charset="utf-8">
  </head>
  <body>
    <script>
      "use strict";

      const ALLOWED_ORIGINS = new Set([
        "https://valeriyameteleva.github.io",
        "http://127.0.0.1:8765",
        "http://127.0.0.1:8766",
        "http://localhost:8765",
        "http://localhost:8766"
      ]);

      window.addEventListener("message", event => {
        if (!event.source || !ALLOWED_ORIGINS.has(event.origin)) return;
        const message = event.data;
        if (message?.type === "family-chores-bridge-ping") {
          event.source.postMessage({ type: "family-chores-bridge-ready" }, event.origin);
          return;
        }
        if (!message || typeof message.id !== "string" || typeof message.action !== "string") return;

        google.script.run
          .withSuccessHandler(result => {
            event.source.postMessage({ id: message.id, ok: true, result }, event.origin);
          })
          .withFailureHandler(error => {
            event.source.postMessage({
              id: message.id,
              ok: false,
              error: error && error.message ? error.message : "Ошибка серверного запроса."
            }, event.origin);
          })
          .apiDispatch(message.action, message.payload || {});
      });
    </script>
  </body>
</html>

<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#eeece4">
  <meta name="description" content="Семейный список дел, вознаграждений и выплат.">
  <meta name="application-name" content="Наши дела">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" href="./icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="./icon.svg">
  <title>Наши дела</title>
  <style>
    :root {
      color-scheme: light;
      --ink: #25332d;
      --muted: #78827b;
      --paper: #eeece4;
      --card: #fbfaf6;
      --green: #376b52;
      --green-light: #e4efe5;
      --orange: #e2a35d;
      --line: #dedcd2;
      --red: #a74b43;
      --input: #fff;
      --input-ink: #25332d;
      font-family: "Segoe UI", "Arial", sans-serif;
    }

    body[data-theme="lilac"] {
      --ink: #352c3e; --muted: #7d7188; --paper: #f0ebf5; --card: #fcfaff;
      --green: #71558a; --green-light: #e9dff2; --line: #ddd2e5;
    }
    body[data-theme="blue"] {
      --ink: #283746; --muted: #728191; --paper: #eaf0f6; --card: #fbfdff;
      --green: #426d94; --green-light: #dceaf6; --line: #d3dee9;
    }
    body[data-theme="gray"] {
      --ink: #30363a; --muted: #747d82; --paper: #eceeef; --card: #fbfbfb;
      --green: #5b686f; --green-light: #e0e6e8; --line: #d6dcde;
    }
    body[data-theme="green"] {
      --ink: #29372d; --muted: #718075; --paper: #e9eee8; --card: #fbfdf9;
      --green: #426b4c; --green-light: #dfeade; --line: #d3dfd2;
    }
    body[data-theme="dark-gray"] {
      color-scheme: dark;
      --ink: #eef2ef; --muted: #b2bcb5; --paper: #252a30; --card: #343b43;
      --green: #78ae8c; --green-light: #3b5747; --line: #4a535c;
      --input: #414951; --input-ink: #f3f5f3;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-width: 320px;
      min-height: 100vh;
      background: var(--paper);
      color: var(--ink);
    }

    button, input, textarea, select { font: inherit; }
    button { cursor: pointer; }

    .shell {
      width: min(100% - 32px, 920px);
      margin: 0 auto;
      padding: 28px 0 56px;
    }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 32px;
    }

    .brand { display: flex; align-items: center; gap: 11px; }
    .brand-mark {
      display: grid;
      width: 42px;
      height: 42px;
      place-items: center;
      border-radius: 15px;
      background: var(--green-light);
      font-size: 22px;
    }
    .brand-name { font-size: 17px; font-weight: 750; letter-spacing: -.3px; }
    .demo-badge {
      padding: 8px 11px;
      border: 1px solid #e8d6bc;
      border-radius: 99px;
      background: #fff7eb;
      color: #825a2e;
      font-size: 12px;
      font-weight: 650;
    }

    main { max-width: 720px; margin: 0 auto; }
    .eyebrow {
      margin: 0 0 8px;
      color: var(--green);
      font-size: 13px;
      font-weight: 750;
      letter-spacing: .08em;
      text-transform: uppercase;
    }
    h1 { margin: 0; font-size: clamp(29px, 6vw, 42px); letter-spacing: -1.3px; }
    .intro { margin: 12px 0 26px; color: var(--muted); line-height: 1.55; }

    .panel, .balance-card, .task, .request, .member-card {
      border: 1px solid var(--line);
      border-radius: 20px;
      background: var(--card);
      box-shadow: 0 5px 18px #3b473b0a;
    }
    .panel { padding: clamp(20px, 5vw, 30px); }
    .field { display: grid; gap: 8px; margin: 18px 0; }
    label { font-size: 14px; font-weight: 650; }
    input, textarea, select {
      width: 100%;
      border: 1px solid #dcded6;
      border-radius: 12px;
      background: var(--input);
      color: var(--input-ink);
      padding: 13px 14px;
      outline: none;
    }
    input:focus, textarea:focus, select:focus { border-color: var(--green); box-shadow: 0 0 0 3px #376b5217; }
    textarea { min-height: 92px; resize: vertical; }
    .role-grid, .task-grid, .request-list, .member-list { display: grid; gap: 12px; }
    .role-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); margin: 20px 0; }
    .role-option {
      min-height: 94px;
      border: 1px solid var(--line);
      border-radius: 16px;
      background: var(--card);
      color: var(--ink);
      font-size: 17px;
      font-weight: 700;
    }
    .role-option[aria-pressed="true"] { border-color: var(--green); background: var(--green-light); }
    .button {
      display: inline-flex;
      min-height: 46px;
      align-items: center;
      justify-content: center;
      gap: 8px;
      border: 0;
      border-radius: 12px;
      background: var(--green);
      color: white;
      padding: 11px 18px;
      font-weight: 700;
    }
    .button:hover { filter: brightness(.96); }
    .button:disabled { cursor: wait; opacity: .65; }
    .button.secondary { border: 1px solid var(--line); background: var(--card); color: var(--ink); }
    .button.danger { background: #a74b43; }
    .button.small { min-height: 38px; padding: 8px 12px; font-size: 14px; }
    .form-actions { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 20px; }
    .hint { margin: 9px 0 0; color: var(--muted); font-size: 13px; line-height: 1.45; }
    .error { min-height: 20px; margin: 10px 0 0; color: var(--red); font-size: 14px; }
    .sync-panel { margin-bottom: 22px; }
    .sync-panel .section-heading { margin-top: 0; }

    .dashboard-head {
      display: flex;
      align-items: end;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 22px;
    }
    .dashboard-actions { display: flex; align-items: center; gap: 8px; }
    .icon-button {
      display: grid; width: 40px; height: 40px; place-items: center;
      border: 1px solid var(--line); border-radius: 12px; background: var(--card); color: var(--ink);
    }
    .icon-button:hover { border-color: var(--green); color: var(--green); }
    .balance-card {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 26px;
      padding: 21px 24px;
      background: var(--green-light);
    }
    .balance-label { color: var(--green); font-size: 14px; font-weight: 650; }
    .balance-value { margin-top: 5px; font-size: clamp(30px, 7vw, 40px); font-weight: 800; letter-spacing: -1px; }
    .fund-progress { margin-top: 10px; min-width: min(60vw, 330px); }
    .fund-progress-label { display: flex; justify-content: space-between; gap: 12px; color: var(--muted); font-size: 12px; }
    .progress-track { height: 7px; margin-top: 5px; overflow: hidden; border-radius: 99px; background: var(--card); }
    .progress-fill { height: 100%; border-radius: inherit; background: var(--green); }
    .balance-icon { font-size: 34px; }
    .balance-topline { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
    .payout-request-button {
      display: grid;
      width: 40px;
      height: 40px;
      flex: 0 0 auto;
      place-items: center;
      border: 1px solid #c8d8c8;
      border-radius: 12px;
      background: #fffefa;
      color: var(--green);
    }
    .payout-request-button:hover:not(:disabled) { background: white; border-color: var(--green); }
    .payout-request-button:disabled { cursor: not-allowed; opacity: .48; }
    .payout-note { margin: 10px 0 0; color: #815b2f; font-size: 13px; font-weight: 650; }
    .section-heading {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 12px;
      margin: 25px 0 12px;
    }
    h2 { margin: 0; font-size: 20px; letter-spacing: -.4px; }
    .section-note { color: var(--muted); font-size: 13px; }
    .task-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .task {
      display: flex;
      min-height: 126px;
      flex-direction: column;
      align-items: flex-start;
      justify-content: space-between;
      gap: 14px;
      padding: 18px;
      color: var(--ink);
      text-align: left;
      transition: transform .12s, border-color .12s;
    }
    .task:hover { transform: translateY(-2px); border-color: #aac3ad; }
    .task:active { background: var(--green-light); }
    .task-name { font-size: 17px; font-weight: 700; }
    .task-price { color: var(--green); font-size: 20px; font-weight: 800; }
    .request {
      position: relative;
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 18px;
      padding: 17px;
    }
    .request.has-delete { padding-right: 58px; }
    .request + .request { margin-top: 10px; }
    .request-title { font-weight: 750; }
    .request-meta { margin-top: 5px; color: var(--muted); font-size: 13px; }
    .request-comment { margin-top: 10px; line-height: 1.45; overflow-wrap: anywhere; }
    .request-actions { display: flex; flex-shrink: 0; gap: 7px; }
    .delete-request {
      position: absolute;
      top: 10px;
      right: 10px;
      display: grid;
      width: 36px;
      height: 36px;
      place-items: center;
      border: 0;
      border-radius: 10px;
      background: transparent;
      color: #78827b;
    }
    .delete-request:hover { background: #fae9e7; color: var(--red); }
    .delete-request:focus-visible { outline: 2px solid var(--green); outline-offset: 2px; }
    .status { color: #815b2f; font-size: 13px; font-weight: 700; }
    .status.approved { color: var(--green); }
    .status.rejected { color: var(--red); }
    .member-list { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .member-card { display: flex; justify-content: space-between; gap: 10px; padding: 15px; }
    .member-role { display: block; margin-top: 4px; color: var(--muted); font-size: 12px; }
    .member-details { display: grid; gap: 5px; }
    .member-controls { display: grid; justify-items: end; gap: 7px; }
    .task-controls { display: flex; flex-wrap: wrap; justify-content: flex-end; gap: 7px; }
    .money-small { color: var(--muted); font-size: 12px; }
    .settings-group { margin: 18px 0; padding-top: 14px; border-top: 1px solid var(--line); }
    .settings-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(100px, 1fr)); gap: 9px; margin-top: 10px; }
    .theme-option { min-height: 44px; padding: 8px; border: 1px solid var(--line); border-radius: 11px; background: var(--card); color: var(--ink); }
    .theme-option::before { content: ""; display: inline-block; width: 11px; height: 11px; margin-right: 6px; border: 1px solid var(--line); border-radius: 50%; vertical-align: -1px; background: var(--theme-swatch); }
    .theme-option[data-theme-option="default"] { --theme-swatch: #376b52; }
    .theme-option[data-theme-option="lilac"] { --theme-swatch: #71558a; }
    .theme-option[data-theme-option="blue"] { --theme-swatch: #426d94; }
    .theme-option[data-theme-option="gray"] { --theme-swatch: #5b686f; }
    .theme-option[data-theme-option="green"] { --theme-swatch: #426b4c; }
    .theme-option[data-theme-option="dark-gray"] { --theme-swatch: #252a30; }
    .theme-option[aria-pressed="true"] { border-color: var(--green); box-shadow: inset 0 0 0 1px var(--green); }
    .member-balance { color: var(--green); font-weight: 750; white-space: nowrap; }
    .empty {
      padding: 22px;
      border: 1px dashed #d5d9d0;
      border-radius: 16px;
      color: var(--muted);
      text-align: center;
    }
    .history {
      margin-top: 22px;
      overflow: hidden;
      border: 1px solid var(--line);
      border-radius: 16px;
      background: var(--card);
    }
    .history summary {
      display: flex;
      min-height: 56px;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 15px 18px;
      cursor: pointer;
      font-weight: 750;
      list-style: none;
    }
    .history summary::-webkit-details-marker { display: none; }
    .history summary::after { content: "+"; color: var(--green); font-size: 22px; font-weight: 500; }
    .history[open] summary::after { content: "−"; }
    .history-content { display: grid; gap: 10px; padding: 0 14px 14px; }
    .history-content .request { background: var(--card); }
    .history .empty { margin: 0; }
    .payout-blocking { z-index: 10; }
    .payout-blocking-card { text-align: center; padding: clamp(28px, 7vw, 48px); }
    .payout-blocking-card h2 { font-size: clamp(25px, 6vw, 34px); }
    .payout-amount { margin: 18px 0; color: var(--green); font-size: clamp(36px, 9vw, 54px); font-weight: 800; }
    .payout-blocking-card .form-actions { justify-content: center; }
    .payout-blocking-card .button { min-height: 54px; padding: 14px 24px; font-size: 17px; }
    .modal {
      position: fixed;
      z-index: 5;
      inset: 0;
      display: grid;
      place-items: center;
      padding: 18px;
      background: #17231dcc;
    }
    .modal-card {
      width: min(100%, 440px);
      max-height: min(90vh, 680px);
      overflow: auto;
      border-radius: 20px;
      background: var(--card);
      padding: 24px;
      box-shadow: 0 18px 60px #0003;
    }
    .modal-card h2 { margin-bottom: 8px; }
    .modal-card .intro { margin: 0 0 18px; }
    .disclaimer {
      margin-top: 30px;
      padding: 13px 15px;
      border-radius: 12px;
      background: #f0eee7;
      color: #656c64;
      font-size: 12px;
      line-height: 1.5;
    }
    .hidden { display: none !important; }

    @media (max-width: 560px) {
      .shell { width: min(100% - 24px, 920px); padding-top: 17px; }
      .topbar { margin-bottom: 25px; }
      .role-grid, .task-grid, .member-list { grid-template-columns: 1fr; }
      .task { min-height: 100px; flex-direction: row; align-items: center; }
      .request { flex-direction: column; }
      .request-actions { width: 100%; }
      .request-actions .button { flex: 1; }
      .dashboard-head { align-items: flex-start; flex-direction: column; }
    }
  </style>
</head>
<body>
  <div class="shell">
    <header class="topbar">
      <div class="brand">
        <div class="brand-mark" aria-hidden="true">🏡</div>
        <div class="brand-name">Наши дела</div>
      </div>
      <div class="demo-badge">Прототип · данные пока только на этом устройстве</div>
    </header>
    <main id="app" aria-live="polite"></main>
    </div>

  <script>
    "use strict";

    const STORAGE_KEY = "family-chores-prototype-v1";
    const LEGACY_BACKEND_URL_KEY = "family-chores-backend-url-v1";
    const API_URL_KEY = "family-chores-api-url-v2";
    const FAMILY_CODE_KEY = "family-chores-family-code-v1";
    const PARENT_NAME_KEY = "family-chores-parent-name-v1";
    const CHILD_PROFILES_KEY = "family-chores-child-profiles-v1";
    const SYNC_VERSION_KEY = "family-chores-sync-version-v1";
    const SYNC_MEMBER_ID_KEY = "family-chores-sync-member-id-v1";
    const SYNC_DIRTY_KEY = "family-chores-sync-dirty-v1";
    const SYNC_CONFLICT_KEY = "family-chores-sync-conflict-v1";
    const OFFLINE_PIN_KEY = "family-chores-offline-pin-v1";
    const THEME_KEY = "family-chores-theme-v1";
    const THEMES = {
      default: { label: "По умолчанию", color: "#eeece4" },
      lilac: { label: "Сиреневый", color: "#f0ebf5" },
      blue: { label: "Голубой", color: "#eaf0f6" },
      gray: { label: "Серый", color: "#eceeef" },
      green: { label: "Зелёный", color: "#e9eee8" },
      "dark-gray": { label: "Тёмно-серый", color: "#252a30" }
    };
    const DEMO_STATE = {
      pin: null,
      members: [],
      tasks: [
        { id: "dishes", title: "Помыть посуду", price: 20, active: true },
        { id: "room", title: "Убрать комнату", price: 40, active: true },
        { id: "plants", title: "Полить цветы", price: 15, active: true },
        { id: "table", title: "Накрыть на стол", price: 10, active: true }
      ],
      requests: [],
      payments: [],
      funds: [],
      savingsRequests: []
    };

    let selectedTheme = THEMES[localStorage.getItem(THEME_KEY)] ? localStorage.getItem(THEME_KEY) : "default";
    let state = loadState();
    let apiUrl = localStorage.getItem(API_URL_KEY) || "";
    let cloudLoginMode = Boolean(apiUrl || localStorage.getItem(LEGACY_BACKEND_URL_KEY));
    let hasUnsyncedChanges = localStorage.getItem(SYNC_DIRTY_KEY) === "true";
    let hasSyncConflict = localStorage.getItem(SYNC_CONFLICT_KEY) === "true";
    let isSyncing = false;
    let offlineSession = false;
    let childProfiles = loadChildProfiles();
    let currentSessionToken = "";
    let currentRole = "";
    let currentServerVersion = 0;
    let selectedRole = "";
    let currentMemberId = "";
    let addingMember = false;
    let modal = null;
    let choreHistoryOpen = false;
    let paymentHistoryOpen = false;
    let notice = "";

    function loadState() {
      try {
        const saved = localStorage.getItem(STORAGE_KEY);
        if (!saved) return structuredClone(DEMO_STATE);
        const parsed = JSON.parse(saved);
        return {
          ...structuredClone(DEMO_STATE),
          ...parsed,
          members: Array.isArray(parsed.members) ? parsed.members : [],
          tasks: Array.isArray(parsed.tasks) ? parsed.tasks : structuredClone(DEMO_STATE.tasks),
          requests: Array.isArray(parsed.requests) ? parsed.requests : [],
          payments: Array.isArray(parsed.payments) ? parsed.payments : [],
          funds: Array.isArray(parsed.funds) ? parsed.funds : [],
          savingsRequests: Array.isArray(parsed.savingsRequests) ? parsed.savingsRequests : []
        };
      } catch (error) {
        console.error("Не удалось загрузить сохранённые данные.", error);
        return structuredClone(DEMO_STATE);
      }
    }

    function loadChildProfiles() {
      try {
        const saved = JSON.parse(localStorage.getItem(CHILD_PROFILES_KEY) || "[]");
        return Array.isArray(saved) ? saved : [];
      } catch (error) {
        console.error("Не удалось загрузить список детских профилей.", error);
        return [];
      }
    }

    function cacheChildProfiles(members) {
      childProfiles = members
        .filter(member => member.role === "child")
        .map(member => ({ id: member.id, name: member.name }));
      localStorage.setItem(CHILD_PROFILES_KEY, JSON.stringify(childProfiles));
    }

    function rememberChildProfile(member) {
      if (!member || member.role !== "child") return;
      childProfiles = childProfiles.filter(profile => profile.id !== member.id)
        .concat([{ id: member.id, name: member.name }]);
      localStorage.setItem(CHILD_PROFILES_KEY, JSON.stringify(childProfiles));
    }

    function persistSyncMetadata() {
      localStorage.setItem(SYNC_DIRTY_KEY, String(hasUnsyncedChanges));
      localStorage.setItem(SYNC_CONFLICT_KEY, String(hasSyncConflict));
      if (currentMemberId) localStorage.setItem(SYNC_MEMBER_ID_KEY, currentMemberId);
      localStorage.setItem(SYNC_VERSION_KEY, String(currentServerVersion));
    }

    async function saveOfflinePin(pin, memberId) {
      const saltBytes = crypto.getRandomValues(new Uint8Array(16));
      const salt = Array.from(saltBytes, byte => byte.toString(16).padStart(2, "0")).join("");
      const digest = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(`${salt}:${pin}`));
      const hash = Array.from(new Uint8Array(digest), byte => byte.toString(16).padStart(2, "0")).join("");
      const saved = JSON.parse(localStorage.getItem(OFFLINE_PIN_KEY) || "null");
      const records = Array.isArray(saved) ? saved : saved ? [saved] : [];
      const updated = records.filter(record => record.memberId !== memberId);
      updated.push({ salt, hash, memberId });
      localStorage.setItem(OFFLINE_PIN_KEY, JSON.stringify(updated));
    }

    async function verifyOfflinePin(pin, memberId) {
      try {
        const saved = JSON.parse(localStorage.getItem(OFFLINE_PIN_KEY) || "null");
        const records = Array.isArray(saved) ? saved : saved ? [saved] : [];
        const record = records.find(item => item.memberId === memberId);
        if (!record) return false;
        const digest = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(`${record.salt}:${pin}`));
        const hash = Array.from(new Uint8Array(digest), byte => byte.toString(16).padStart(2, "0")).join("");
        return hash === record.hash;
      } catch (error) {
        console.error("Не удалось проверить PIN для офлайн-входа.", error);
        return false;
      }
    }

    function startOfflineSession(memberId, role, message) {
      const member = state.members.find(item => item.id === memberId && item.role === role);
      if (!member) return false;
      if (hasUnsyncedChanges && localStorage.getItem(SYNC_MEMBER_ID_KEY) !== memberId) {
        notice = "На устройстве есть несинхронизированные правки другого профиля. Сначала войдите в него и отправьте изменения.";
        return false;
      }
      currentSessionToken = "";
      currentMemberId = member.id;
      currentRole = member.role;
      currentServerVersion = Number(localStorage.getItem(SYNC_VERSION_KEY) || 0);
      offlineSession = true;
      cloudLoginMode = true;
      selectedRole = role;
      notice = message;
      return true;
    }

    function verifyParentPin(pin) {
      if (currentSessionToken) return apiCall("verifyPin", { token: currentSessionToken, pin });
      if (offlineSession) {
        return verifyOfflinePin(pin, currentMemberId)
          .then(verified => verified
            ? { verified: true }
            : Promise.reject(new Error("PIN не подошёл.")));
      }
      return pin === state.pin
        ? Promise.resolve({ verified: true })
        : Promise.reject(new Error("PIN не подошёл."));
    }

    function saveState() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
      if (currentSessionToken || offlineSession) {
        hasUnsyncedChanges = true;
        hasSyncConflict = false;
        persistSyncMetadata();
      }
      return Promise.resolve();
    }

    function setApiUrl(value) {
      let url;
      try {
        url = new URL(String(value || "").trim());
      } catch (error) {
        throw new Error("Введите полный HTTPS-адрес Cloudflare Worker.");
      }
      const localHost = ["localhost", "127.0.0.1"].includes(url.hostname);
      if ((!localHost && (url.protocol !== "https:" || !url.hostname.endsWith(".workers.dev"))) ||
          (localHost && !["http:", "https:"].includes(url.protocol)) ||
          (url.pathname !== "/" && url.pathname !== "") || url.search || url.hash) {
        throw new Error("Введите корневой HTTPS-адрес Cloudflare Worker, заканчивающийся на .workers.dev.");
      }
      apiUrl = url.origin;
      localStorage.setItem(API_URL_KEY, apiUrl);
      cloudLoginMode = true;
    }

    async function apiCall(action, payload) {
      if (!apiUrl) throw new Error("Сначала укажите адрес Cloudflare Worker.");
      const controller = new AbortController();
      const timeout = window.setTimeout(() => controller.abort(), 30000);
      try {
        const response = await fetch(apiUrl, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ action, payload }),
          signal: controller.signal
        });
        let result;
        try {
          result = await response.json();
        } catch (error) {
          throw new Error("Прокси вернул некорректный ответ. Проверьте публикацию Cloudflare Worker.");
        }
        if (!response.ok || !result || result.ok !== true) {
          const error = new Error(String(result?.error || `Ошибка сервера (HTTP ${response.status}).`));
          error.httpStatus = response.status;
          throw error;
        }
        return result.result;
      } catch (error) {
        if (error.name === "AbortError") {
          throw new Error("Сервер не ответил за 30 секунд. Проверьте доступность Cloudflare Worker и Apps Script.");
        }
        if (error instanceof TypeError) {
          throw new Error("Не удалось связаться с Cloudflare Worker. Проверьте его адрес, публикацию и настройки CORS.");
        }
        throw error;
      } finally {
        window.clearTimeout(timeout);
      }
    }

    async function sendCloudChanges() {
      if (!currentSessionToken || !hasUnsyncedChanges || isSyncing) return;
      isSyncing = true;
      notice = "Отправляем изменения в семейную базу…";
      render();
      const token = currentSessionToken;
      try {
        const response = await apiCall("syncState", {
          token,
          version: currentServerVersion,
          state: { ...structuredClone(state), pin: null }
        });
        if (currentSessionToken !== token) return;
        currentServerVersion = response.version;
        state = { ...response.state, pin: null };
        hasUnsyncedChanges = false;
        hasSyncConflict = false;
        if (currentRole === "parent") cacheChildProfiles(state.members);
        else rememberChildProfile(state.members.find(member => member.id === currentMemberId));
        localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
        persistSyncMetadata();
        notice = "Изменения отправлены в семейную базу.";
      } catch (error) {
        console.error("Не удалось отправить изменения в семейную базу.", error);
        if (/Данные уже изменились на другом устройстве/i.test(error.message)) {
          hasSyncConflict = true;
          persistSyncMetadata();
          notice = "Семейная база изменилась после последней загрузки. Ваши правки сохранены на устройстве; выберите, как поступить с конфликтом.";
        } else if (/Сеанс истёк/i.test(error.message)) {
          currentSessionToken = "";
          offlineSession = true;
          notice = "Сеанс сервера истёк. Ваши правки остались на устройстве. Подключитесь к интернету и войдите снова для синхронизации.";
        } else {
          notice = `Не удалось отправить изменения: ${error.message}`;
        }
      } finally {
        isSyncing = false;
        render();
      }
    }

    function downloadLocalBackup() {
      const backup = new Blob([JSON.stringify({
        exportedAt: new Date().toISOString(),
        memberId: currentMemberId,
        state
      }, null, 2)], { type: "application/json" });
      const url = URL.createObjectURL(backup);
      const link = document.createElement("a");
      link.href = url;
      link.download = `family-chores-local-${new Date().toISOString().slice(0, 10)}.json`;
      link.click();
      window.setTimeout(() => URL.revokeObjectURL(url), 1000);
    }

    async function receiveCloudChanges(discardLocalChanges = false) {
      if (!currentSessionToken || isSyncing) return;
      if (hasUnsyncedChanges && !discardLocalChanges) {
        notice = hasSyncConflict
          ? "Есть конфликт. Скачайте резервную копию и примите семейную версию, либо оставьте локальные правки."
          : "Сначала отправьте локальные изменения. Загрузка семейных данных заменит текущее состояние.";
        render();
        return;
      }
      if (discardLocalChanges) {
        const accepted = window.confirm("Сначала будет скачана резервная копия ваших локальных правок. Затем текущие данные заменятся семейной версией. Продолжить?");
        if (!accepted) return;
        downloadLocalBackup();
      }
      isSyncing = true;
      notice = "Загружаем семейные изменения…";
      render();
      const token = currentSessionToken;
      try {
        const response = await apiCall("readState", { token });
        if (currentSessionToken !== token) return;
        currentServerVersion = response.version;
        state = { ...response.state, pin: null };
        hasUnsyncedChanges = false;
        hasSyncConflict = false;
        if (currentRole === "parent") cacheChildProfiles(state.members);
        localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
        persistSyncMetadata();
        notice = "Семейные изменения приняты.";
      } catch (error) {
        console.error("Не удалось загрузить семейные изменения.", error);
        if (/Сеанс истёк/i.test(error.message)) {
          currentSessionToken = "";
          offlineSession = true;
          notice = "Сеанс сервера истёк. Ваши локальные данные сохранены. Войдите снова для загрузки семейных изменений.";
        } else {
          notice = `Не удалось загрузить изменения: ${error.message}`;
        }
      } finally {
        isSyncing = false;
        render();
      }
    }

    async function refreshChildProfiles() {
      if (!apiUrl) return;
      const cachedProfiles = childProfiles;
      notice = "Загружаем список детских профилей…";
      render();
      try {
        const response = await apiCall("listChildProfiles", {});
        childProfiles = response.members;
        localStorage.setItem(CHILD_PROFILES_KEY, JSON.stringify(childProfiles));
        notice = "";
      } catch (error) {
        console.error("Не удалось загрузить список детских профилей.", error);
        childProfiles = cachedProfiles;
        notice = childProfiles.length
          ? "Нет соединения. Показаны сохранённые на этом устройстве профили."
          : `Не удалось загрузить список детей: ${error.message}`;
      }
      render();
    }

    function escapeHtml(value) {
      return String(value).replace(/[&<>"']/g, char => ({
        "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
      })[char]);
    }

    function money(value) {
      return new Intl.NumberFormat("ru-RU", { maximumFractionDigits: 2 }).format(value) + " ₽";
    }

    function emptyFund(memberId) {
      return {
        memberId, debtTarget: 0, debtRemaining: 0, debtPaidTotal: 0, debtRate: 50,
        savingsTarget: 0, savingsRate: 0, savingsBalance: 0, savingsTotal: 0, savingsWithdrawn: 0
      };
    }

    function fundForMember(memberId) {
      let fund = state.funds.find(item => item.memberId === memberId);
      if (!fund) {
        fund = emptyFund(memberId);
        state.funds.push(fund);
      }
      return fund;
    }

    function applyTheme(theme) {
      selectedTheme = THEMES[theme] ? theme : "default";
      document.body.dataset.theme = selectedTheme;
      document.querySelector('meta[name="theme-color"]').content = THEMES[selectedTheme].color;
    }

    function setTheme(theme) {
      if (!THEMES[theme]) return;
      localStorage.setItem(THEME_KEY, theme);
      applyTheme(theme);
    }

    function availableSavings(memberId) {
      const fund = fundForMember(memberId);
      const reserved = state.savingsRequests
        .filter(request => request.memberId === memberId &&
          (request.status === "requested" || request.status === "awaiting_child_confirmation"))
        .reduce((sum, request) => sum + Math.round(Number(request.amount) * 100), 0);
      return Math.max(0, Math.round(Number(fund.savingsBalance) * 100) - reserved) / 100;
    }

    function memberBalance(memberId) {
      const earned = state.requests
        .filter(request => request.memberId === memberId && request.status === "approved")
        .reduce((sum, request) => sum + Math.round(Number(request.price) * 100), 0);
      const fund = fundForMember(memberId);
      const paid = state.payments
        .filter(payment => payment.memberId === memberId &&
          (payment.status === "awaiting_child_confirmation" || payment.status === "confirmed"))
        .reduce((sum, payment) => sum + Math.round(Number(payment.amount) * 100), 0);
      return Math.max(0, earned - paid -
        Math.round(Number(fund.debtPaidTotal) * 100) -
        Math.round(Number(fund.savingsTotal) * 100)) / 100;
    }

    function availableForPayout(memberId) {
      const reserved = state.payments
        .filter(payment => payment.memberId === memberId && payment.status === "requested")
        .reduce((sum, payment) => sum + Math.round(Number(payment.amount) * 100), 0);
      return Math.max(0, Math.round(memberBalance(memberId) * 100) - reserved) / 100;
    }

    function accountProgresses(fund) {
      const progress = [];
      if (Number(fund.debtRemaining) > 0 && Number(fund.debtTarget) > 0) {
        progress.push({
          label: `Погашение долга · ${money(fund.debtPaidTotal)} из ${money(fund.debtTarget)}`,
          value: Math.min(100, Number(fund.debtPaidTotal) / Number(fund.debtTarget) * 100)
        });
      }
      if (Number(fund.savingsTarget) > 0) {
        progress.push({
          label: `Накоплено ${money(fund.savingsBalance)} из ${money(fund.savingsTarget)}`,
          value: Math.min(100, Number(fund.savingsBalance) / Number(fund.savingsTarget) * 100)
        });
      }
      if (!progress.length && Number(fund.debtTarget) > 0) {
        progress.push({ label: `Долг погашен · ${money(fund.debtPaidTotal)}`, value: 100 });
      }
      return progress;
    }

    function applyChoreAllocation(memberId, amount) {
      const fund = fundForMember(memberId);
      const earned = Math.round(Number(amount) * 100);
      const debtPart = Math.min(
        Math.round(Number(fund.debtRemaining) * 100),
        Math.round(earned * Number(fund.debtRate) / 100)
      );
      const afterDebt = earned - debtPart;
      const savingsPart = Number(fund.savingsTarget) > Number(fund.savingsBalance)
        ? Math.min(
          Math.round((Number(fund.savingsTarget) - Number(fund.savingsBalance)) * 100),
          Math.round(afterDebt * Number(fund.savingsRate) / 100)
        )
        : 0;
      fund.debtRemaining = (Math.round(Number(fund.debtRemaining) * 100) - debtPart) / 100;
      fund.debtPaidTotal = (Math.round(Number(fund.debtPaidTotal) * 100) + debtPart) / 100;
      fund.savingsBalance = (Math.round(Number(fund.savingsBalance) * 100) + savingsPart) / 100;
      fund.savingsTotal = (Math.round(Number(fund.savingsTotal) * 100) + savingsPart) / 100;
      if (fund.debtRemaining === 0 && Number(fund.debtTarget) > 0) fund.debtTarget = fund.debtPaidTotal;
    }

    function formatTimestamp(value) {
      const date = new Date(value);
      return Number.isNaN(date.getTime())
        ? String(value || "")
        : new Intl.DateTimeFormat("ru-RU", { dateStyle: "short", timeStyle: "short" }).format(date);
    }

    function paymentStatusLabel(status) {
      return status === "requested"
        ? "Запрошена"
        : status === "awaiting_child_confirmation"
          ? "Не подтверждено ребёнком"
          : "Получение подтверждено";
    }

    function memberName(memberId) {
      return state.members.find(member => member.id === memberId)?.name || "Участник";
    }

    function renderPaymentHistory(memberId, includeAll) {
      const entries = [
        ...state.payments
          .filter(payment => includeAll || payment.memberId === memberId)
          .map(payment => ({ ...payment, kind: "balance" })),
        ...state.savingsRequests
          .filter(request => includeAll || request.memberId === memberId)
          .map(request => ({ ...request, kind: "savings" }))
      ].sort((a, b) => String(b.createdAt).localeCompare(String(a.createdAt)));
      const rows = entries.length ? entries.map(payment => `
        <article class="request">
          <div>
            <div class="request-title">${includeAll ? `${escapeHtml(memberName(payment.memberId))} · ` : ""}${payment.kind === "savings" ? "Снятие накоплений · " : ""}${money(payment.amount)}</div>
            <div class="request-meta">Запрос: ${escapeHtml(formatTimestamp(payment.createdAt))}</div>
            ${payment.paidAt ? `<div class="request-meta">Оплачено: ${escapeHtml(formatTimestamp(payment.paidAt))}</div>` : ""}
            ${payment.confirmedAt ? `<div class="request-meta">Получение подтверждено: ${escapeHtml(formatTimestamp(payment.confirmedAt))}</div>` : ""}
            <div class="request-meta status ${payment.status === "confirmed" ? "approved" : payment.status === "rejected" ? "rejected" : "pending"}">${payment.status === "rejected" ? "Отклонено" : paymentStatusLabel(payment.status)}</div>
          </div>
        </article>
      `).join("") : `<div class="empty">Выплат пока нет.</div>`;
      return `
        <details class="history payment-history" id="payment-history" ${paymentHistoryOpen ? "open" : ""}>
          <summary>История выплат <span class="section-note">${entries.length}</span></summary>
          <div class="history-content">${rows}</div>
        </details>
      `;
    }

    function renderSyncPanel() {
      if (!currentSessionToken && !offlineSession) return "";
      const actionsDisabled = !currentSessionToken || isSyncing;
      const localChanges = hasUnsyncedChanges;
      const status = isSyncing
        ? "Выполняется синхронизация…"
        : localChanges
          ? "Есть изменения только на этом устройстве."
          : "Локальных изменений для отправки нет.";
      return `
        <section class="panel sync-panel" aria-label="Ручная синхронизация">
          <div class="section-heading"><h2>Синхронизация</h2><span class="section-note">${escapeHtml(status)}</span></div>
          <p class="hint">Отправка передаёт ваши изменения в семейную базу. Принятие загружает изменения семьи на это устройство.</p>
          <div class="form-actions">
            <button type="button" class="button" data-sync-send ${actionsDisabled || !localChanges ? "disabled" : ""}>Отправить изменения</button>
            <button type="button" class="button secondary" data-sync-receive ${actionsDisabled || localChanges ? "disabled" : ""}>Принять изменения</button>
            ${hasSyncConflict && currentSessionToken ? `<button type="button" class="button danger" data-sync-conflict>Скачать копию и принять семейные</button>` : ""}
            ${offlineSession ? `<button type="button" class="button secondary" data-connect-online>Подключиться для обмена</button>` : ""}
          </div>
          ${hasSyncConflict ? `<p class="error">Версии разошлись. Локальные правки не перезаписаны. Чтобы принять семейную версию, сначала скачайте резервную копию.</p>` : ""}
        </section>
      `;
    }

    function render() {
      const app = document.getElementById("app");
      document.querySelector(".demo-badge").textContent = currentSessionToken
        ? "Подключено к семейной Google-таблице"
        : offlineSession
          ? "Офлайн · изменения пока только на этом устройстве"
          : "Прототип · данные пока только на этом устройстве";
      if (offlineSession) {
        const member = state.members.find(item => item.id === currentMemberId);
        if (!member) {
          offlineSession = false;
          currentMemberId = "";
          selectedRole = "";
          showPage(app, renderCloudLogin());
          return;
        }
        showPage(app, member.role === "parent" ? renderParent(member) : renderChild(member));
        return;
      }
      if (cloudLoginMode || currentSessionToken) {
        if (!currentSessionToken) {
          showPage(app, renderCloudLogin());
          return;
        }
        const cloudMember = state.members.find(member => member.id === currentMemberId);
        if (!cloudMember) {
          currentSessionToken = "";
          currentMemberId = "";
          showPage(app, renderCloudLogin());
          return;
        }
        showPage(app, cloudMember.role === "parent" ? renderParent(cloudMember) : renderChild(cloudMember));
        return;
      }
      if (addingMember || state.members.length === 0) {
        showPage(app, renderSetup());
        return;
      }
      if (!currentMemberId || !state.members.some(member => member.id === currentMemberId)) {
        showPage(app, renderLogin());
        return;
      }
      const member = state.members.find(item => item.id === currentMemberId);
      showPage(app, member.role === "parent" ? renderParent(member) : renderChild(member));
    }

          payment.memberId === activeMember.id && payment.status === "awaiting_child_confirmation"
        );

          request.memberId === activeMember.id && request.status === "awaiting_child_confirmation"

                  </div>
                  ${Number(fund.debtRemaining) > 0 ? `<p class="hint">Остаток долга: ${money(fund.debtRemaining)}. Изменить или отменить долг может родитель.</p>` : ""}
                </div>
              ` : ""}
              <div class="form-actions"><button class="button secondary" type="button" data-close-modal>Готово</button></div>
            </section>
          </div>
        `;
      }
      if (modal.type === "fund-setup") {
        const fund = fundForMember(currentMemberId);
        const isSavings = modal.mode === "savings";
        const maxRate = isSavings && Number(fund.debtRemaining) > 0 ? 20 : 50;
        const currentTarget = isSavings ? fund.savingsTarget : fund.debtRemaining;
        const currentRate = isSavings ? fund.savingsRate : 50;
        const minTarget = isSavings ? fund.savingsBalance : 0.01;
        return `
          <div class="modal" role="presentation">
            <section class="modal-card" role="dialog" aria-modal="true" aria-labelledby="modal-title">
              <h2 id="modal-title">${isSavings ? "Накопить на цель" : "Отдать долг"}</h2>
              <p class="intro">${isSavings
                ? `Укажи цель и процент от остатка заработка. ${Number(fund.debtRemaining) > 0 ? "При долге на накопления можно направлять не более 20% после удержания долга." : "Можно направлять не более 50% заработка."}`
                : "Укажи остаток долга и процент удержания с каждого подтверждённого дела."}</p>
              ${!isSavings && Number(fund.savingsRate) > 20 ? `<p class="hint">После включения долга доля накоплений будет ограничена 20% остатка.</p>` : ""}
              <form id="fund-setup-form">
                <input type="hidden" name="mode" value="${modal.mode}">
                <div class="field"><label for="fund-target">${isSavings ? "Желаемая сумма, ₽" : "Сумма долга, ₽"}</label><input id="fund-target" name="target" type="number" min="${minTarget}" max="100000" step="0.01" value="${currentTarget > 0 ? currentTarget : ""}" required></div>
                <div class="field"><label for="fund-percent">Процент от заработка, %</label><input id="fund-percent" name="percent" type="number" min="0" max="${maxRate}" step="1" value="${currentRate || (isSavings ? Math.min(20, maxRate) : 50)}" required></div>
                <p class="error" id="modal-error">${escapeHtml(modal.error || "")}</p>
                <div class="form-actions"><button class="button" type="submit">Сохранить</button><button class="button secondary" type="button" data-close-modal>Отмена</button></div>
              </form>
            </section>
          </div>
        `;
      }
      if (modal.type === "savings-request") {

                <div class="field"><label for="savings-withdraw-amount">Сумма, ₽</label><input id="savings-withdraw-amount" name="amount" type="number" min="0.01" max="${maximum}" step="0.01" value="${maximum}" required></div>
                <p class="error" id="modal-error">${escapeHtml(modal.error || "")}</p>
                <div class="form-actions"><button class="button" type="submit">Отправить родителю</button><button class="button secondary" type="button" data-close-modal>Отмена</button></div>
              </form>
            </section>
          </div>
        `;
      }
      if (modal.type === "manage-debt") {
        const fund = fundForMember(modal.memberId);
        return `
          <div class="modal" role="presentation">
            <section class="modal-card" role="dialog" aria-modal="true" aria-labelledby="modal-title">
              <h2 id="modal-title">Изменить долг</h2>
              <p class="intro">${escapeHtml(memberName(modal.memberId))} · текущий остаток ${money(fund.debtRemaining)}. Укажите 0, чтобы отменить долг.</p>
              <form id="manage-debt-form">

                <div class="field"><label for="debt-manage-pin">PIN родителей</label><input id="debt-manage-pin" name="pin" inputmode="numeric" pattern="[0-9]{4}" maxlength="4" autocomplete="off" type="password" required></div>
                <p class="error" id="modal-error">${escapeHtml(modal.error || "")}</p>
                <div class="form-actions"><button class="button" type="submit">Сохранить</button><button class="button secondary" type="button" data-close-modal>Отмена</button></div>

            </section>
          </div>
        `;

      if (modal.type === "savings-pay") {
        const request = state.savingsRequests.find(item => item.id === modal.requestId && item.status === "requested");

        return `
          <div class="modal" role="presentation">
            <section class="modal-card" role="dialog" aria-modal="true" aria-labelledby="modal-title">
              <h2 id="modal-title">Выплатить из накоплений?</h2>
              <p class="intro">${escapeHtml(memberName(request.memberId))} · ${money(request.amount)}</p>
              <p class="hint">После оплаты ребёнок подтвердит получение. До подтверждения сумма останется зарезервированной.</p>
              <form id="savings-pay-form">
                <div class="field"><label for="savings-pay-pin">PIN родителей</label><input id="savings-pay-pin" name="pin" inputmode="numeric" pattern="[0-9]{4}" maxlength="4" autocomplete="off" type="password" required></div>
                <p class="error" id="modal-error">${escapeHtml(modal.error || "")}</p>
                <div class="form-actions"><button class="button" type="submit">Произвести оплату</button><button class="button secondary" type="button" data-close-modal>Отмена</button></div>

            </section>
          </div>
        `;
      }
      if (modal.type === "savings-reject") {

        if (!request) return "";
        return `
          <div class="modal" role="presentation">
            <section class="modal-card" role="dialog" aria-modal="true" aria-labelledby="modal-title">
              <h2 id="modal-title">Отклонить запрос?</h2>
              <p class="intro">${escapeHtml(memberName(request.memberId))} · ${money(request.amount)} из накоплений</p>
              <form id="savings-reject-form">
                <div class="field"><label for="savings-reject-pin">PIN родителей</label><input id="savings-reject-pin" name="pin" inputmode="numeric" pattern="[0-9]{4}" maxlength="4" autocomplete="off" type="password" required></div>

            </section>
          </div>
        `;

      if (modal.type === "task") {

        return `
          <div class="modal" role="presentation">

                <div class="field"><label for="child-comment">Комментарий (необязательно)</label><textarea id="child-comment" name="comment" maxlength="500" placeholder="Например: помыл всю посуду после ужина"></textarea></div>

              </form>
            </section>
          </div>
        `;
      }
      if (modal.type === "edit-task") {
        const task = state.tasks.find(item => item.id === modal.taskId);
        if (!task) return "";
        return `
          <div class="modal" role="presentation">
            <section class="modal-card" role="dialog" aria-modal="true" aria-labelledby="modal-title">
              <h2 id="modal-title">Изменить дело</h2>

                <div class="field"><label for="edit-task-child">Кому видно</label><select id="edit-task-child" name="visibleTo"><option value="">Всем детям</option>${state.members.filter(child => child.role === "child").map(child => `<option value="${escapeHtml(child.id)}" ${task.visibleTo === child.id ? "selected" : ""}>${escapeHtml(child.name)}</option>`).join("")}</select></div>

                <div class="form-actions"><button class="button" type="submit">Сохранить</button><button class="button secondary" type="button" data-close-modal>Отмена</button></div>
              </form>
            </section>
          </div>
        `;
      }
      if (modal.type === "delete-task") {
        const task = state.tasks.find(item => item.id === modal.taskId);

        return `

            <section class="modal-card" role="dialog" aria-modal="true" aria-labelledby="modal-title">

                <div class="field"><label for="delete-task-pin">PIN родителей</label><input id="delete-task-pin" name="pin" inputmode="numeric" pattern="[0-9]{4}" maxlength="4" autocomplete="off" type="password" required></div>

                <div class="form-actions"><button class="button danger" type="submit">Удалить</button><button class="button secondary" type="button" data-close-modal>Отмена</button></div>
              </form>
            </section>
          </div>
        `;
      }
      if (modal.type === "review") {
        const request = state.requests.find(item => item.id === modal.requestId);
        if (!request) return "";
        return `
          <div class="modal" role="presentation">
            <section class="modal-card" role="dialog" aria-modal="true" aria-labelledby="modal-title">
              <h2 id="modal-title">${modal.status === "approved" ? "Подтвердить дело?" : "Отклонить дело?"}</h2>
              <p class="intro">${escapeHtml(memberName(request.memberId))} · ${escapeHtml(request.taskTitle)} · ${money(request.price)}</p>
              ${request.comment ? `<p class="request-comment">Комментарий ребёнка: «${escapeHtml(request.comment)}»</p>` : ""}
              <form id="review-form">
                ${modal.status === "rejected" ? `<div class="field"><label for="parent-comment">Комментарий ребёнку (необязательно)</label><textarea id="parent-comment" name="parentComment" maxlength="500"></textarea></div>` : ""}
                <p class="error" id="modal-error">${escapeHtml(modal.error || "")}</p>
                <div class="form-actions"><button class="button ${modal.status === "rejected" ? "danger" : ""}" type="submit">${modal.status === "approved" ? "Подтвердить" : "Отклонить"}</button><button class="button secondary" type="button" data-close-modal>Отмена</button></div>
              </form>
            </section>
          </div>
        `;
      }
      if (modal.type === "payout-request") {
        const maximum = availableForPayout(currentMemberId);
        if (maximum <= 0) return "";
        return `
          <div class="modal" role="presentation">
            <section class="modal-card" role="dialog" aria-modal="true" aria-labelledby="modal-title">
              <h2 id="modal-title">Запросить выплату</h2>
              <p class="intro">Доступно к запросу: ${money(maximum)}</p>
              <form id="payout-request-form">
                <div class="field"><label for="payout-amount">Сумма, ₽</label><input id="payout-amount" name="amount" type="number" min="0.01" max="${maximum}" step="0.01" value="${maximum}" required></div>
                <p class="error" id="modal-error">${escapeHtml(modal.error || "")}</p>
                <div class="form-actions"><button class="button" type="submit">Отправить запрос</button><button class="button secondary" type="button" data-close-modal>Отмена</button></div>
              </form>
            </section>
          </div>
        `;
      }
      if (modal.type === "pay-request") {
        const payment = state.payments.find(item => item.id === modal.paymentId && item.status === "requested");
        if (!payment) return "";
        return `
          <div class="modal" role="presentation">
            <section class="modal-card" role="dialog" aria-modal="true" aria-labelledby="modal-title">
              <h2 id="modal-title">Подтвердить оплату?</h2>
              <p class="intro">${escapeHtml(memberName(payment.memberId))} · ${money(payment.amount)}</p>
              <p class="hint">После подтверждения сумма сразу вычтется из доступного баланса. Ребёнку нужно будет подтвердить получение.</p>
              <form id="pay-request-form">
                <div class="field"><label for="pay-pin">PIN родителей</label><input id="pay-pin" name="pin" inputmode="numeric" pattern="[0-9]{4}" maxlength="4" autocomplete="off" type="password" required></div>
                <p class="error" id="modal-error">${escapeHtml(modal.error || "")}</p>
                <div class="form-actions"><button class="button" type="submit">Произвести оплату</button><button class="button secondary" type="button" data-close-modal>Отмена</button></div>
              </form>
            </section>
          </div>
        `;
      }
      if (modal.type === "delete-request") {
        const request = state.requests.find(item =>
          item.id === modal.requestId &&
          item.memberId === currentMemberId &&
          item.status === "pending"
        );
        if (!request) return "";
        return `
          <div class="modal" role="presentation">
            <section class="modal-card" role="dialog" aria-modal="true" aria-labelledby="modal-title">
              <h2 id="modal-title">Удалить отправленное дело?</h2>
              <p class="intro">${escapeHtml(request.taskTitle)} · ${money(request.price)}</p>
              <p class="hint">Заявка исчезнет из списка родителя. Это действие нельзя отменить.</p>
              <div class="form-actions">
                <button class="button danger" type="button" data-confirm-delete="${escapeHtml(request.id)}">Удалить</button>
                <button class="button secondary" type="button" data-close-modal>Оставить</button>
              </div>
            </section>
          </div>
        `;
      }
      if (modal.type === "member") {
        return `
          <div class="modal" role="presentation">
            <section class="modal-card" role="dialog" aria-modal="true" aria-labelledby="modal-title">
              <h2 id="modal-title">Добавить ребёнка</h2>
              <p class="intro">Профиль появится на остальных устройствах после отправки изменений.</p>
              <form id="member-form">
                <div class="field"><label for="new-member-name">Имя</label><input id="new-member-name" name="name" maxlength="40" required></div>
                <input type="hidden" name="role" value="child">
                <p class="error" id="modal-error">${escapeHtml(modal.error || "")}</p>
                <div class="form-actions"><button class="button" type="submit">Создать профиль</button><button class="button secondary" type="button" data-close-modal>Отмена</button></div>
              </form>
            </section>
          </div>
        `;
      }
      if (modal.type === "edit-member") {
        const member = state.members.find(item => item.id === modal.memberId && item.role === "child");
        if (!member) return "";
        return `
          <div class="modal" role="presentation">
            <section class="modal-card" role="dialog" aria-modal="true" aria-labelledby="modal-title">
              <h2 id="modal-title">Изменить профиль ребёнка</h2>
              <form id="edit-member-form">
                <div class="field"><label for="edit-member-name">Имя</label><input id="edit-member-name" name="name" maxlength="40" value="${escapeHtml(member.name)}" required></div>
                <p class="error" id="modal-error">${escapeHtml(modal.error || "")}</p>
                <div class="form-actions"><button class="button" type="submit">Сохранить</button><button class="button secondary" type="button" data-close-modal>Отмена</button></div>
              </form>
            </section>
          </div>
        `;
      }
      if (modal.type === "delete-member") {
        const member = state.members.find(item => item.id === modal.memberId && item.role === "child");
        if (!member) return "";
        const recordCount = state.requests.filter(item => item.memberId === member.id).length +
          state.payments.filter(item => item.memberId === member.id).length +
          state.savingsRequests.filter(item => item.memberId === member.id).length;
        return `
          <div class="modal" role="presentation">
            <section class="modal-card" role="dialog" aria-modal="true" aria-labelledby="modal-title">
              <h2 id="modal-title">Удалить профиль «${escapeHtml(member.name)}»?</h2>
              <p class="intro">Удаление необратимо. Будут удалены профиль, баланс, накопления, долг и история (${recordCount} записей). Дела, доступные только этому ребёнку, станут доступны всем детям.</p>
              <form id="delete-member-form">
                <div class="field"><label for="delete-member-pin">PIN родителей</label><input id="delete-member-pin" name="pin" inputmode="numeric" pattern="[0-9]{4}" maxlength="4" autocomplete="off" type="password" required></div>
                <p class="error" id="modal-error">${escapeHtml(modal.error || "")}</p>
                <div class="form-actions"><button type="submit" class="button danger">Удалить профиль и историю</button><button class="button secondary" type="button" data-close-modal>Отмена</button></div>
              </form>
            </section>
          </div>
        `;
      }
      if (modal.type === "invite-code") {
        return `
          <div class="modal" role="presentation">
            <section class="modal-card" role="dialog" aria-modal="true" aria-labelledby="modal-title">
              <h2 id="modal-title">Профиль создан</h2>
              <p class="intro">Передайте ребёнку этот код вместе с семейным кодом. Код профиля показывается только сейчас.</p>
              <p class="payout-amount" id="invite-code-value">${escapeHtml(modal.inviteCode)}</p>
              <div class="form-actions"><button class="button" type="button" id="copy-invite-code">Скопировать код</button><button class="button secondary" type="button" data-close-modal>Готово</button></div>
            </section>
          </div>
        `;
      }
      return "";
    }

      const parentsFull = state.members.filter(member => member.role === "parent").length >= 2;
      const childrenFull = state.members.filter(member => member.role === "child").length >= 10;

        <p class="eyebrow">Семейный помощник</p>
        <h1>${addingMember ? "Добавим участника" : "Начнём знакомство"}</h1>

          <div class="role-grid">
            <button type="button" class="role-option" data-role="child" aria-pressed="${selectedRole === "child"}" ${childrenFull ? "disabled" : ""}>Ребёнок</button>
            <button type="button" class="role-option" data-role="parent" aria-pressed="${selectedRole === "parent"}" ${parentsFull ? "disabled" : ""}>Родитель</button>
          </div>

            <div class="field">
              <label for="member-name">Ваше имя</label>
              <input id="member-name" name="name" maxlength="40" autocomplete="name" placeholder="Например, Маша" required>
            </div>
            <div id="pin-field" class="field ${selectedRole === "parent" && (!state.pin || addingMember) ? "" : "hidden"}">
              <label for="parent-pin">${addingMember && state.pin ? "Введите текущий PIN родителей" : "Придумайте общий PIN родителей"}</label>
              <input id="parent-pin" name="pin" inputmode="numeric" pattern="[0-9]{4}" maxlength="4" placeholder="4 цифры" ${selectedRole === "parent" && (!state.pin || addingMember) ? "required" : ""}>
              ${!addingMember && !state.pin ? `<p class="hint">Родительский PIN понадобится при входе в профиль родителя.</p>` : ""}
            </div>
            <p class="error" id="form-error">${escapeHtml(notice)}</p>
            <div class="form-actions"><button class="button" type="submit">Продолжить</button></div>
          </form>
        </section>
        <div class="disclaimer">Локальный прототип хранит данные только в этом браузере. Можно создать до 10 детских профилей.</div>
      `;

<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#eeece4">
  <meta name="description" content="Семейный список дел, вознаграждений и выплат.">
  <meta name="application-name" content="Наши дела">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" href="./icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="./icon.svg">
  <title>Наши дела</title>
  <style>
    :root {
      color-scheme: light;
      --ink: #25332d;
      --muted: #78827b;
      --paper: #eeece4;
      --card: #fbfaf6;
      --green: #376b52;
      --green-light: #e4efe5;
      --orange: #e2a35d;
      --line: #dedcd2;
      --red: #a74b43;
      --input: #fff;
      --input-ink: #25332d;
      font-family: "Segoe UI", "Arial", sans-serif;
    }

    body[data-theme="lilac"] {
      --ink: #352c3e; --muted: #7d7188; --paper: #f0ebf5; --card: #fcfaff;
      --green: #71558a; --green-light: #e9dff2; --line: #ddd2e5;
    }
    body[data-theme="blue"] {
      --ink: #283746; --muted: #728191; --paper: #eaf0f6; --card: #fbfdff;
      --green: #426d94; --green-light: #dceaf6; --line: #d3dee9;
    }
    body[data-theme="gray"] {
      --ink: #30363a; --muted: #747d82; --paper: #eceeef; --card: #fbfbfb;
      --green: #5b686f; --green-light: #e0e6e8; --line: #d6dcde;
    }
    body[data-theme="green"] {
      --ink: #29372d; --muted: #718075; --paper: #e9eee8; --card: #fbfdf9;
      --green: #426b4c; --green-light: #dfeade; --line: #d3dfd2;
    }
    body[data-theme="dark-gray"] {
      color-scheme: dark;
      --ink: #eef2ef; --muted: #b2bcb5; --paper: #252a30; --card: #343b43;
      --green: #78ae8c; --green-light: #3b5747; --line: #4a535c;
      --input: #414951; --input-ink: #f3f5f3;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-width: 320px;
      min-height: 100vh;
      background: var(--paper);
      color: var(--ink);
    }

    button, input, textarea, select { font: inherit; }
    button { cursor: pointer; }

    .shell {
      width: min(100% - 32px, 920px);
      margin: 0 auto;
      padding: 28px 0 56px;
    }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 32px;
    }

    .brand { display: flex; align-items: center; gap: 11px; }
    .brand-mark {
      display: grid;
      width: 42px;
      height: 42px;
      place-items: center;
      border-radius: 15px;
      background: var(--green-light);
      font-size: 22px;
    }
    .brand-name { font-size: 17px; font-weight: 750; letter-spacing: -.3px; }
    .demo-badge {
      padding: 8px 11px;
      border: 1px solid #e8d6bc;
      border-radius: 99px;
      background: #fff7eb;
      color: #825a2e;
      font-size: 12px;
      font-weight: 650;
    }

    main { max-width: 720px; margin: 0 auto; }
    .eyebrow {
      margin: 0 0 8px;
      color: var(--green);
      font-size: 13px;
      font-weight: 750;
      letter-spacing: .08em;
      text-transform: uppercase;
    }
    h1 { margin: 0; font-size: clamp(29px, 6vw, 42px); letter-spacing: -1.3px; }
    .intro { margin: 12px 0 26px; color: var(--muted); line-height: 1.55; }

    .panel, .balance-card, .task, .request, .member-card {
      border: 1px solid var(--line);
      border-radius: 20px;
      background: var(--card);
      box-shadow: 0 5px 18px #3b473b0a;
    }
    .panel { padding: clamp(20px, 5vw, 30px); }
    .field { display: grid; gap: 8px; margin: 18px 0; }
    label { font-size: 14px; font-weight: 650; }
    input, textarea, select {
      width: 100%;
      border: 1px solid #dcded6;
      border-radius: 12px;
      background: var(--input);
      color: var(--input-ink);
      padding: 13px 14px;
      outline: none;
    }
    input:focus, textarea:focus, select:focus { border-color: var(--green); box-shadow: 0 0 0 3px #376b5217; }
    textarea { min-height: 92px; resize: vertical; }
    .role-grid, .task-grid, .request-list, .member-list { display: grid; gap: 12px; }
    .role-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); margin: 20px 0; }
    .role-option {
      min-height: 94px;
      border: 1px solid var(--line);
      border-radius: 16px;
      background: var(--card);
      color: var(--ink);
      font-size: 17px;
      font-weight: 700;
    }
    .role-option[aria-pressed="true"] { border-color: var(--green); background: var(--green-light); }
    .button {
      display: inline-flex;
      min-height: 46px;
      align-items: center;
      justify-content: center;
      gap: 8px;
      border: 0;
      border-radius: 12px;
      background: var(--green);
      color: white;
      padding: 11px 18px;
      font-weight: 700;
    }
    .button:hover { filter: brightness(.96); }
    .button:disabled { cursor: wait; opacity: .65; }
    .button.secondary { border: 1px solid var(--line); background: var(--card); color: var(--ink); }
    .button.danger { background: #a74b43; }
    .button.small { min-height: 38px; padding: 8px 12px; font-size: 14px; }
    .form-actions { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 20px; }
    .hint { margin: 9px 0 0; color: var(--muted); font-size: 13px; line-height: 1.45; }
    .error { min-height: 20px; margin: 10px 0 0; color: var(--red); font-size: 14px; }

    .dashboard-head {
      display: flex;
      align-items: end;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 22px;
    }
    .dashboard-actions { display: flex; align-items: center; gap: 8px; }
    .icon-button {
      display: grid; width: 40px; height: 40px; place-items: center;
      border: 1px solid var(--line); border-radius: 12px; background: var(--card); color: var(--ink);
    }
    .icon-button:hover { border-color: var(--green); color: var(--green); }
    .balance-card {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 26px;
      padding: 21px 24px;
      background: var(--green-light);
    }
    .balance-label { color: var(--green); font-size: 14px; font-weight: 650; }
    .balance-value { margin-top: 5px; font-size: clamp(30px, 7vw, 40px); font-weight: 800; letter-spacing: -1px; }
    .fund-progress { margin-top: 10px; min-width: min(60vw, 330px); }
    .fund-progress-label { display: flex; justify-content: space-between; gap: 12px; color: var(--muted); font-size: 12px; }
    .progress-track { height: 7px; margin-top: 5px; overflow: hidden; border-radius: 99px; background: var(--card); }
    .progress-fill { height: 100%; border-radius: inherit; background: var(--green); }
    .balance-icon { font-size: 34px; }
    .balance-topline { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
    .payout-request-button {
      display: grid;
      width: 40px;
      height: 40px;
      flex: 0 0 auto;
      place-items: center;
      border: 1px solid #c8d8c8;
      border-radius: 12px;
      background: #fffefa;
      color: var(--green);
    }
    .payout-request-button:hover:not(:disabled) { background: white; border-color: var(--green); }
    .payout-request-button:disabled { cursor: not-allowed; opacity: .48; }
    .payout-note { margin: 10px 0 0; color: #815b2f; font-size: 13px; font-weight: 650; }
    .section-heading {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 12px;
      margin: 25px 0 12px;
    }
    h2 { margin: 0; font-size: 20px; letter-spacing: -.4px; }
    .section-note { color: var(--muted); font-size: 13px; }
    .task-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .task {
      display: flex;
      min-height: 126px;
      flex-direction: column;
      align-items: flex-start;
      justify-content: space-between;
      gap: 14px;
      padding: 18px;
      color: var(--ink);
      text-align: left;
      transition: transform .12s, border-color .12s;
    }
    .task:hover { transform: translateY(-2px); border-color: #aac3ad; }
    .task:active { background: var(--green-light); }
    .task-name { font-size: 17px; font-weight: 700; }
    .task-price { color: var(--green); font-size: 20px; font-weight: 800; }
    .request {
      position: relative;
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 18px;
      padding: 17px;
    }
    .request.has-delete { padding-right: 58px; }
    .request + .request { margin-top: 10px; }
    .request-title { font-weight: 750; }
    .request-meta { margin-top: 5px; color: var(--muted); font-size: 13px; }
    .request-comment { margin-top: 10px; line-height: 1.45; overflow-wrap: anywhere; }
    .request-actions { display: flex; flex-shrink: 0; gap: 7px; }
    .delete-request {
      position: absolute;
      top: 10px;
      right: 10px;
      display: grid;
      width: 36px;
      height: 36px;
      place-items: center;
      border: 0;
      border-radius: 10px;
      background: transparent;
      color: #78827b;
    }
    .delete-request:hover { background: #fae9e7; color: var(--red); }
    .delete-request:focus-visible { outline: 2px solid var(--green); outline-offset: 2px; }
    .status { color: #815b2f; font-size: 13px; font-weight: 700; }
    .status.approved { color: var(--green); }
    .status.rejected { color: var(--red); }
    .member-list { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .member-card { display: flex; justify-content: space-between; gap: 10px; padding: 15px; }
    .member-role { display: block; margin-top: 4px; color: var(--muted); font-size: 12px; }
    .member-details { display: grid; gap: 5px; }
    .member-controls { display: grid; justify-items: end; gap: 7px; }
    .task-controls { display: flex; flex-wrap: wrap; justify-content: flex-end; gap: 7px; }
    .money-small { color: var(--muted); font-size: 12px; }
    .settings-group { margin: 18px 0; padding-top: 14px; border-top: 1px solid var(--line); }
    .settings-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(100px, 1fr)); gap: 9px; margin-top: 10px; }
    .theme-option { min-height: 44px; padding: 8px; border: 1px solid var(--line); border-radius: 11px; background: var(--card); color: var(--ink); }
    .theme-option::before { content: ""; display: inline-block; width: 11px; height: 11px; margin-right: 6px; border: 1px solid var(--line); border-radius: 50%; vertical-align: -1px; background: var(--theme-swatch); }
    .theme-option[data-theme-option="default"] { --theme-swatch: #376b52; }
    .theme-option[data-theme-option="lilac"] { --theme-swatch: #71558a; }
    .theme-option[data-theme-option="blue"] { --theme-swatch: #426d94; }
    .theme-option[data-theme-option="gray"] { --theme-swatch: #5b686f; }
    .theme-option[data-theme-option="green"] { --theme-swatch: #426b4c; }
    .theme-option[data-theme-option="dark-gray"] { --theme-swatch: #252a30; }
    .theme-option[aria-pressed="true"] { border-color: var(--green); box-shadow: inset 0 0 0 1px var(--green); }
    .member-balance { color: var(--green); font-weight: 750; white-space: nowrap; }
    .empty {
      padding: 22px;
      border: 1px dashed #d5d9d0;
      border-radius: 16px;
      color: var(--muted);
      text-align: center;
    }
    .history {
      margin-top: 22px;
      overflow: hidden;
      border: 1px solid var(--line);
      border-radius: 16px;
      background: var(--card);
    }
    .history summary {
      display: flex;
      min-height: 56px;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 15px 18px;
      cursor: pointer;
      font-weight: 750;
      list-style: none;
    }
    .history summary::-webkit-details-marker { display: none; }
    .history summary::after { content: "+"; color: var(--green); font-size: 22px; font-weight: 500; }
    .history[open] summary::after { content: "−"; }
    .history-content { display: grid; gap: 10px; padding: 0 14px 14px; }
    .history-content .request { background: var(--card); }
    .history .empty { margin: 0; }
    .payout-blocking { z-index: 10; }
    .payout-blocking-card { text-align: center; padding: clamp(28px, 7vw, 48px); }
    .payout-blocking-card h2 { font-size: clamp(25px, 6vw, 34px); }
    .payout-amount { margin: 18px 0; color: var(--green); font-size: clamp(36px, 9vw, 54px); font-weight: 800; }
    .payout-blocking-card .form-actions { justify-content: center; }
    .payout-blocking-card .button { min-height: 54px; padding: 14px 24px; font-size: 17px; }
    .modal {
      position: fixed;
      z-index: 5;
      inset: 0;
      display: grid;
      place-items: center;
      padding: 18px;
      background: #17231dcc;
    }
    .modal-card {
      width: min(100%, 440px);
      max-height: min(90vh, 680px);
      overflow: auto;
      border-radius: 20px;
      background: var(--card);
      padding: 24px;
      box-shadow: 0 18px 60px #0003;
    }
    .modal-card h2 { margin-bottom: 8px; }
    .modal-card .intro { margin: 0 0 18px; }
    .disclaimer {
      margin-top: 30px;
      padding: 13px 15px;
      border-radius: 12px;
      background: #f0eee7;
      color: #656c64;
      font-size: 12px;
      line-height: 1.5;
    }
    .hidden { display: none !important; }
    #backend-bridge { position: fixed; width: 1px; height: 1px; border: 0; opacity: 0; pointer-events: none; }

    @media (max-width: 560px) {
      .shell { width: min(100% - 24px, 920px); padding-top: 17px; }
      .topbar { margin-bottom: 25px; }
      .role-grid, .task-grid, .member-list { grid-template-columns: 1fr; }
      .task { min-height: 100px; flex-direction: row; align-items: center; }
      .request { flex-direction: column; }
      .request-actions { width: 100%; }
      .request-actions .button { flex: 1; }
      .dashboard-head { align-items: flex-start; flex-direction: column; }
    }
  </style>
</head>
<body>
  <div class="shell">
    <header class="topbar">
      <div class="brand">
        <div class="brand-mark" aria-hidden="true">🏡</div>
        <div class="brand-name">Наши дела</div>
      </div>
      <div class="demo-badge">Прототип · данные пока только на этом устройстве</div>
    </header>
    <main id="app" aria-live="polite"></main>
    <iframe id="backend-bridge" title="Соединение с семейной базой" aria-hidden="true"></iframe>
    </div>

  <script>
    "use strict";

    const STORAGE_KEY = "family-chores-prototype-v1";
    const BACKEND_URL_KEY = "family-chores-backend-url-v1";
    const THEME_KEY = "family-chores-theme-v1";
    const THEMES = {
      default: { label: "По умолчанию", color: "#eeece4" },
      lilac: { label: "Сиреневый", color: "#f0ebf5" },
      blue: { label: "Голубой", color: "#eaf0f6" },
      gray: { label: "Серый", color: "#eceeef" },
      green: { label: "Зелёный", color: "#e9eee8" },
      "dark-gray": { label: "Тёмно-серый", color: "#252a30" }
    };
    const DEMO_STATE = {
      pin: null,
      members: [],
      tasks: [
        { id: "dishes", title: "Помыть посуду", price: 20, active: true },
        { id: "room", title: "Убрать комнату", price: 40, active: true },
        { id: "plants", title: "Полить цветы", price: 15, active: true },
        { id: "table", title: "Накрыть на стол", price: 10, active: true }
      ],
      requests: [],
      payments: [],
      funds: [],
      savingsRequests: []
    };

    let selectedTheme = THEMES[localStorage.getItem(THEME_KEY)] ? localStorage.getItem(THEME_KEY) : "default";
    let state = loadState();
    let backendUrl = localStorage.getItem(BACKEND_URL_KEY) || "";
    let cloudLoginMode = Boolean(backendUrl);
    let currentSessionToken = "";
    let currentRole = "";
    let currentServerVersion = 0;
    let cloudSaveQueue = Promise.resolve();
    let cloudRefreshTimer = 0;
    let bridgeReady = false;
    let bridgeFrameUrl = "";
    let nextRpcId = 0;
    const pendingRpc = new Map();
    let selectedRole = "";
    let currentMemberId = "";
    let addingMember = false;
    let modal = null;
    let pendingParentAction = null;
    let choreHistoryOpen = false;
    let paymentHistoryOpen = false;
    let notice = "";

    function loadState() {
      try {
        const saved = localStorage.getItem(STORAGE_KEY);
        if (!saved) return structuredClone(DEMO_STATE);
        const parsed = JSON.parse(saved);
        return {
          ...structuredClone(DEMO_STATE),
          ...parsed,
          members: Array.isArray(parsed.members) ? parsed.members : [],
          tasks: Array.isArray(parsed.tasks) ? parsed.tasks : structuredClone(DEMO_STATE.tasks),
          requests: Array.isArray(parsed.requests) ? parsed.requests : [],
          payments: Array.isArray(parsed.payments) ? parsed.payments : [],
          funds: Array.isArray(parsed.funds) ? parsed.funds : [],
          savingsRequests: Array.isArray(parsed.savingsRequests) ? parsed.savingsRequests : []
        };
      } catch (error) {
        console.error("Не удалось загрузить сохранённые данные.", error);
        return structuredClone(DEMO_STATE);
      }
    }

    function verifyParentPin(pin) {
      if (currentSessionToken) return apiCall("verifyPin", { token: currentSessionToken, pin });
      return pin === state.pin
        ? Promise.resolve({ verified: true })
        : Promise.reject(new Error("PIN не подошёл."));
    }

    function startCloudRefresh() {
      window.clearInterval(cloudRefreshTimer);
      cloudRefreshTimer = window.setInterval(async () => {
        const token = currentSessionToken;
        const activeElement = document.activeElement;
        if (!token || modal || document.querySelector(".modal") || activeElement?.matches("input, textarea, select")) return;
        try {
          await cloudSaveQueue;
          if (currentSessionToken !== token) return;
          const response = await apiCall("readState", { token });
          if (currentSessionToken !== token) return;
          currentServerVersion = response.version;
          state = { ...response.state, pin: null };
          localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
          render();
        } catch (error) {
          console.error("Не удалось обновить данные из Google Таблицы.", error);
          if (/Сеанс истёк/.test(error.message) && currentSessionToken === token) {
            currentSessionToken = "";
            currentRole = "";
            currentServerVersion = 0;
            currentMemberId = "";
            notice = "Сеанс истёк. Войдите в семейный профиль ещё раз.";
            render();
          }
        }
      }, 15000);
    }

    function saveState(parentPin = "") {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
      if (!currentSessionToken) return Promise.resolve();

      const snapshot = structuredClone(state);
      const token = currentSessionToken;
      cloudSaveQueue = cloudSaveQueue.then(async () => {
        try {
          const response = await apiCall("syncState", {
            token,
            pin: parentPin,
            version: currentServerVersion,
            state: snapshot
          });
          if (currentSessionToken !== token) return;
          currentServerVersion = response.version;
          state = { ...response.state, pin: null };
          localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
          notice = "";
          render();
        } catch (error) {
          console.error("Не удалось сохранить данные в Google Таблицу.", error);
          if (currentSessionToken === token) {
            try {
              const latest = await apiCall("readState", { token });
              currentServerVersion = latest.version;
              state = { ...latest.state, pin: null };
              localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
            } catch (readError) {
              console.error("Не удалось перечитать данные из Google Таблицы.", readError);
            }
            notice = `Не удалось сохранить изменения: ${error.message}`;
            render();
          }
        }
      });
      return cloudSaveQueue;
    }

    function setBackendUrl(value) {
      const url = new URL(String(value || "").trim());
      if (url.protocol !== "https:" || url.hostname !== "script.google.com" ||
          !/^\/macros\/s\/[^/]+\/exec\/?$/.test(url.pathname)) {
        throw new Error("Введите URL веб-приложения Apps Script, заканчивающийся на /exec.");
      }
      backendUrl = url.href;
      localStorage.setItem(BACKEND_URL_KEY, backendUrl);
      cloudLoginMode = true;
      const iframeUrl = `${backendUrl}${backendUrl.includes("?") ? "&" : "?"}bridge=1`;
      if (bridgeFrameUrl !== iframeUrl) {
        bridgeReady = false;
        bridgeFrameUrl = iframeUrl;
        document.getElementById("backend-bridge").src = iframeUrl;
      }
    }

    function isBackendBridgeWindow(source) {
      const frame = document.getElementById("backend-bridge");
      const visit = (target, depth) => {
        if (target === source) return true;
        if (depth >= 5) return false;
        for (let index = 0; index < target.frames.length; index += 1) {
          if (visit(target.frames[index], depth + 1)) return true;
        }
        return false;
      };
      return visit(frame.contentWindow, 0);
    }

    function isBackendOrigin(origin) {
      try {
        const hostname = new URL(origin).hostname;
        return hostname === "script.google.com" ||
          hostname.endsWith(".script.googleusercontent.com");
      } catch (error) {
        return false;
      }
    }

    function postToBackendFrames(message) {
      const frame = document.getElementById("backend-bridge");
      const send = (target, depth) => {
        target.postMessage(message, "*");
        if (depth >= 5) return;
        for (let index = 0; index < target.frames.length; index += 1) {
          send(target.frames[index], depth + 1);
        }
      };
      send(frame.contentWindow, 0);
    }

    window.addEventListener("message", event => {
      if (!isBackendOrigin(event.origin) || !isBackendBridgeWindow(event.source)) return;
      const message = event.data;
      if (message?.type === "family-chores-bridge-ready") {
        bridgeReady = true;
        pendingRpc.forEach(pending => {
          pending.bridgeResponded = true;
        });
        return;
      }
      if (!message || typeof message.id !== "string") return;
      const pending = pendingRpc.get(message.id);
      if (!pending) return;
      pendingRpc.delete(message.id);
      window.clearTimeout(pending.timeout);
      window.clearInterval(pending.poll);
      if (message.ok) pending.resolve(message.result);
      else pending.reject(new Error(String(message.error || "Ошибка сервера.")));
    });

    function apiCall(action, payload) {
      if (!backendUrl) return Promise.reject(new Error("Сначала укажите URL веб-приложения Apps Script."));
      try {
        if (!bridgeFrameUrl) setBackendUrl(backendUrl);
      } catch (error) {
        return Promise.reject(error);
      }
      return new Promise((resolve, reject) => {
        const id = `rpc-${Date.now()}-${++nextRpcId}`;
        const timeout = window.setTimeout(() => {
          const pending = pendingRpc.get(id);
          if (pending) window.clearInterval(pending.poll);
          pendingRpc.delete(id);
          reject(new Error(pending?.bridgeResponded
            ? "Мост ответил, но Apps Script не завершил запрос. Проверьте Code.gs и доступ к таблице."
            : "Мост Apps Script не ответил на проверку соединения. Проверьте, что Bridge опубликован по сохранённому URL."
          ));
        }, 30000);
        const pending = { resolve, reject, timeout, poll: 0 };
        pendingRpc.set(id, pending);
        const send = () => {
          if (!bridgeReady) {
            return;
          }
          window.clearInterval(pending.poll);
          postToBackendFrames({ id, action, payload });
        };
        if (bridgeReady) send();
        else {
          const ping = () => postToBackendFrames({ type: "family-chores-bridge-ping" });
          pending.poll = window.setInterval(() => {
            if (!pendingRpc.has(id)) {
              window.clearInterval(pending.poll);
            } else if (bridgeReady) {
              send();
            } else {
              ping();
            }
          }, 500);
          ping();
        }
      });
    }

    function escapeHtml(value) {
      return String(value).replace(/[&<>"']/g, char => ({
        "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
      })[char]);
    }

    function money(value) {
      return new Intl.NumberFormat("ru-RU", { maximumFractionDigits: 2 }).format(value) + " ₽";
    }

    function emptyFund(memberId) {
      return {
        memberId, debtTarget: 0, debtRemaining: 0, debtPaidTotal: 0, debtRate: 50,
        savingsTarget: 0, savingsRate: 0, savingsBalance: 0, savingsTotal: 0, savingsWithdrawn: 0
      };
    }

    function fundForMember(memberId) {
      let fund = state.funds.find(item => item.memberId === memberId);
      if (!fund) {
        fund = emptyFund(memberId);
        state.funds.push(fund);
      }
      return fund;
    }

    function applyTheme(theme) {
      selectedTheme = THEMES[theme] ? theme : "default";
      document.body.dataset.theme = selectedTheme;
      document.querySelector('meta[name="theme-color"]').content = THEMES[selectedTheme].color;
    }

    function setTheme(theme) {
      if (!THEMES[theme]) return;
      localStorage.setItem(THEME_KEY, theme);
      applyTheme(theme);
    }

    function availableSavings(memberId) {
      const fund = fundForMember(memberId);
      const reserved = state.savingsRequests
        .filter(request => request.memberId === memberId &&
          (request.status === "requested" || request.status === "awaiting_child_confirmation"))
        .reduce((sum, request) => sum + Math.round(Number(request.amount) * 100), 0);
      return Math.max(0, Math.round(Number(fund.savingsBalance) * 100) - reserved) / 100;
    }

    function memberBalance(memberId) {
      const earned = state.requests
        .filter(request => request.memberId === memberId && request.status === "approved")
        .reduce((sum, request) => sum + Math.round(Number(request.price) * 100), 0);
      const fund = fundForMember(memberId);
      const paid = state.payments
        .filter(payment => payment.memberId === memberId &&
          (payment.status === "awaiting_child_confirmation" || payment.status === "confirmed"))
        .reduce((sum, payment) => sum + Math.round(Number(payment.amount) * 100), 0);
      return Math.max(0, earned - paid -
        Math.round(Number(fund.debtPaidTotal) * 100) -
        Math.round(Number(fund.savingsTotal) * 100)) / 100;
    }

    function availableForPayout(memberId) {
      const reserved = state.payments
        .filter(payment => payment.memberId === memberId && payment.status === "requested")
        .reduce((sum, payment) => sum + Math.round(Number(payment.amount) * 100), 0);
      return Math.max(0, Math.round(memberBalance(memberId) * 100) - reserved) / 100;
    }

    function accountProgresses(fund) {
      const progress = [];
      if (Number(fund.debtRemaining) > 0 && Number(fund.debtTarget) > 0) {
        progress.push({
          label: `Погашение долга · ${money(fund.debtPaidTotal)} из ${money(fund.debtTarget)}`,
          value: Math.min(100, Number(fund.debtPaidTotal) / Number(fund.debtTarget) * 100)
        });
      }
      if (Number(fund.savingsTarget) > 0) {
        progress.push({
          label: `Накоплено ${money(fund.savingsBalance)} из ${money(fund.savingsTarget)}`,
          value: Math.min(100, Number(fund.savingsBalance) / Number(fund.savingsTarget) * 100)
        });
      }
      if (!progress.length && Number(fund.debtTarget) > 0) {
        progress.push({ label: `Долг погашен · ${money(fund.debtPaidTotal)}`, value: 100 });
      }
      return progress;
    }

    function applyChoreAllocation(memberId, amount) {
      const fund = fundForMember(memberId);
      const earned = Math.round(Number(amount) * 100);
      const debtPart = Math.min(
        Math.round(Number(fund.debtRemaining) * 100),
        Math.round(earned * Number(fund.debtRate) / 100)
      );
      const afterDebt = earned - debtPart;
      const savingsPart = Number(fund.savingsTarget) > Number(fund.savingsBalance)
        ? Math.min(
          Math.round((Number(fund.savingsTarget) - Number(fund.savingsBalance)) * 100),
          Math.round(afterDebt * Number(fund.savingsRate) / 100)
        )
        : 0;
      fund.debtRemaining = (Math.round(Number(fund.debtRemaining) * 100) - debtPart) / 100;
      fund.debtPaidTotal = (Math.round(Number(fund.debtPaidTotal) * 100) + debtPart) / 100;
      fund.savingsBalance = (Math.round(Number(fund.savingsBalance) * 100) + savingsPart) / 100;
      fund.savingsTotal = (Math.round(Number(fund.savingsTotal) * 100) + savingsPart) / 100;
      if (fund.debtRemaining === 0 && Number(fund.debtTarget) > 0) fund.debtTarget = fund.debtPaidTotal;
    }

    function formatTimestamp(value) {
      const date = new Date(value);
      return Number.isNaN(date.getTime())
        ? String(value || "")
        : new Intl.DateTimeFormat("ru-RU", { dateStyle: "short", timeStyle: "short" }).format(date);
    }

    function paymentStatusLabel(status) {
      return status === "requested"
        ? "Запрошена"
        : status === "awaiting_child_confirmation"
          ? "Не подтверждено ребёнком"
          : "Получение подтверждено";
    }

    function memberName(memberId) {
      return state.members.find(member => member.id === memberId)?.name || "Участник";
    }

    function renderPaymentHistory(memberId, includeAll) {
      const entries = [
        ...state.payments
          .filter(payment => includeAll || payment.memberId === memberId)
          .map(payment => ({ ...payment, kind: "balance" })),
        ...state.savingsRequests
          .filter(request => includeAll || request.memberId === memberId)
          .map(request => ({ ...request, kind: "savings" }))
      ].sort((a, b) => String(b.createdAt).localeCompare(String(a.createdAt)));
      const rows = entries.length ? entries.map(payment => `
        <article class="request">
          <div>
            <div class="request-title">${includeAll ? `${escapeHtml(memberName(payment.memberId))} · ` : ""}${payment.kind === "savings" ? "Снятие накоплений · " : ""}${money(payment.amount)}</div>
            <div class="request-meta">Запрос: ${escapeHtml(formatTimestamp(payment.createdAt))}</div>
            ${payment.paidAt ? `<div class="request-meta">Оплачено: ${escapeHtml(formatTimestamp(payment.paidAt))}</div>` : ""}
            ${payment.confirmedAt ? `<div class="request-meta">Получение подтверждено: ${escapeHtml(formatTimestamp(payment.confirmedAt))}</div>` : ""}
            <div class="request-meta status ${payment.status === "confirmed" ? "approved" : payment.status === "rejected" ? "rejected" : "pending"}">${payment.status === "rejected" ? "Отклонено" : paymentStatusLabel(payment.status)}</div>
          </div>
        </article>
      `).join("") : `<div class="empty">Выплат пока нет.</div>`;
      return `
        <details class="history payment-history" id="payment-history" ${paymentHistoryOpen ? "open" : ""}>
          <summary>История выплат <span class="section-note">${entries.length}</span></summary>
          <div class="history-content">${rows}</div>
        </details>
      `;
    }

    function render() {

      document.querySelector(".demo-badge").textContent = currentSessionToken
        ? "Подключено к семейной Google-таблице"
        : "Прототип · данные пока только на этом устройстве";
      if (cloudLoginMode || currentSessionToken) {
        if (!currentSessionToken) {
          showPage(app, renderCloudLogin());
          return;
        }
        const cloudMember = state.members.find(member => member.id === currentMemberId);
        if (!cloudMember) {

          showPage(app, renderCloudLogin());
          return;
        }
        showPage(app, cloudMember.role === "parent" ? renderParent(cloudMember) : renderChild(cloudMember));

      if (addingMember || state.members.length === 0) {
        showPage(app, renderSetup());
        return;
      }
      if (!currentMemberId || !state.members.some(member => member.id === currentMemberId)) {
        showPage(app, renderLogin());
        return;
      }
      const member = state.members.find(item => item.id === currentMemberId);
      showPage(app, member.role === "parent" ? renderParent(member) : renderChild(member));
    }

          <div class="modal" role="presentation">

            </section>
          </div>

        return `
          <div class="modal" role="presentation">
            <section class="modal-card" role="dialog" aria-modal="true" aria-labelledby="modal-title">
              <h2 id="modal-title">Запросить выплату</h2>
              <p class="intro">Доступно к запросу: ${money(maximum)}</p>
              <form id="payout-request-form">

                <p class="error" id="modal-error">${escapeHtml(modal.error || "")}</p>
                <div class="form-actions"><button class="button" type="submit">Отправить запрос</button><button class="button secondary" type="button" data-close-modal>Отмена</button></div>
              </form>
            </section>
          </div>
        `;
      }
      if (modal.type === "pay-request") {
        const payment = state.payments.find(item => item.id === modal.paymentId && item.status === "requested");
        if (!payment) return "";
        return `
          <div class="modal" role="presentation">
            <section class="modal-card" role="dialog" aria-modal="true" aria-labelledby="modal-title">
              <h2 id="modal-title">Подтвердить оплату?</h2>
              <p class="intro">${escapeHtml(memberName(payment.memberId))} · ${money(payment.amount)}</p>

              <form id="pay-request-form">
                <div class="field"><label for="pay-pin">PIN родителей</label><input id="pay-pin" name="pin" inputmode="numeric" pattern="[0-9]{4}" maxlength="4" autocomplete="off" type="password" required></div>
                <p class="error" id="modal-error">${escapeHtml(modal.error || "")}</p>
                <div class="form-actions"><button class="button" type="submit">Произвести оплату</button><button class="button secondary" type="button" data-close-modal>Отмена</button></div>
              </form>
            </section>
          </div>
        `;
      }
      if (modal.type === "delete-request") {
        const request = state.requests.find(item =>
          item.id === modal.requestId &&
          item.memberId === currentMemberId &&
          item.status === "pending"
        );
        if (!request) return "";
        return `
          <div class="modal" role="presentation">
            <section class="modal-card" role="dialog" aria-modal="true" aria-labelledby="modal-title">
              <h2 id="modal-title">Удалить отправленное дело?</h2>
              <p class="intro">${escapeHtml(request.taskTitle)} · ${money(request.price)}</p>
              <p class="hint">Заявка исчезнет из списка родителя. Это действие нельзя отменить.</p>
              <div class="form-actions">
                <button class="button danger" type="button" data-confirm-delete="${escapeHtml(request.id)}">Удалить</button>
                <button class="button secondary" type="button" data-close-modal>Оставить</button>
              </div>
            </section>
          </div>
        `;
      }
      if (modal.type === "member") {
        return `
          <div class="modal" role="presentation">
            <section class="modal-card" role="dialog" aria-modal="true" aria-labelledby="modal-title">
              <h2 id="modal-title">Добавить участника</h2>
              <p class="intro">Для ребёнка будет создан личный код входа.</p>
              <form id="member-form">
                <div class="field"><label for="new-member-name">Имя</label><input id="new-member-name" name="name" maxlength="40" required></div>
                <div class="field"><label for="new-member-role">Роль</label><select id="new-member-role" name="role"><option value="child">Ребёнок</option><option value="parent">Родитель</option></select></div>
                <div class="field"><label for="member-pin">PIN родителей</label><input id="member-pin" name="pin" inputmode="numeric" pattern="[0-9]{4}" maxlength="4" autocomplete="off" type="password" required></div>
                <p class="error" id="modal-error">${escapeHtml(modal.error || "")}</p>
                <div class="form-actions"><button class="button" type="submit">Создать профиль</button><button class="button secondary" type="button" data-close-modal>Отмена</button></div>
              </form>

              <div class="form-actions"><button class="button" type="button" id="copy-invite-code">Скопировать код</button><button class="button secondary" type="button" data-close-modal>Готово</button></div>

    function renderSetup() {
      const parentsFull = state.members.filter(member => member.role === "parent").length >= 2;
      const childrenFull = state.members.filter(member => member.role === "child").length >= 2;
      return `
        <p class="eyebrow">Семейный помощник</p>
        <h1>${addingMember ? "Добавим участника" : "Начнём знакомство"}</h1>
        <p class="intro">${addingMember ? "Выберите роль и укажите имя нового участника семьи." : "Выберите роль и укажите имя. В этом прототипе можно добавить участников по очереди на одном устройстве."}</p>

    function renderLogin() {
      const members = state.members.map(member =>
        `<option value="${escapeHtml(member.id)}">${escapeHtml(member.name)} — ${member.role === "parent" ? "родитель" : "ребёнок"}</option>`
      ).join("");
      return `
        <p class="eyebrow">С возвращением</p>
        <h1>Кто сейчас у экрана?</h1>

        <section class="panel">
          <form id="login-form">
            <div class="field"><label for="member-select">Профиль</label><select id="member-select" name="memberId">${members}</select></div>
            <p class="error" id="form-error">${escapeHtml(notice)}</p>
            <div class="form-actions"><button class="button" type="submit">Открыть</button><button class="button secondary" type="button" id="add-member">Добавить участника</button></div>
          </form>
        </section>
      `;
    }

    function renderChild(member) {
      const tasks = state.tasks.filter(task => task.active && (!task.visibleTo || task.visibleTo === member.id)).map(task => `
        <button type="button" class="task" data-task-id="${escapeHtml(task.id)}">
          <span class="task-name">${escapeHtml(task.title)}</span><span class="task-price">+ ${money(task.price)}</span>
        </button>
      `).join("");
      const ownRequests = state.requests.filter(request => request.memberId === member.id).slice().reverse();
      const approvedRequests = ownRequests.filter(request => request.status === "approved");
      const recentRequests = ownRequests.filter(request => request.status !== "approved");
      const requestHistory = recentRequests.length ? recentRequests.map(request => `
        <article class="request ${request.status === "pending" ? "has-delete" : ""}">
          <div>
            <div class="request-title">${escapeHtml(request.taskTitle)}</div>

            ${request.parentComment ? `<div class="request-meta">Ответ родителя: ${escapeHtml(request.parentComment)}</div>` : ""}
          </div>
          ${request.status === "pending" ? `<button type="button" class="delete-request" data-delete-request="${escapeHtml(request.id)}" aria-label="Удалить отправленное дело" title="Удалить заявку"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18"/><path d="M8 6V4h8v2"/><path d="m19 6-1 14H6L5 6"/><path d="M10 11v5M14 11v5"/></svg></button>` : ""}
        </article>
      `).join("") : `<div class="empty">Нет дел, ожидающих проверки или отклонённых родителем.</div>`;
      const confirmedHistory = approvedRequests.length ? approvedRequests.map(request => `
        <article class="request">
          <div>
            <div class="request-title">${escapeHtml(request.taskTitle)}</div>
            <div class="request-meta">${escapeHtml(formatTimestamp(request.createdAt))} · ${money(request.price)}</div>
            ${request.comment ? `<div class="request-comment">${escapeHtml(request.comment)}</div>` : ""}
            <div class="request-meta status approved">Подтверждено</div>
          </div>
        </article>
      `).join("") : `<div class="empty">Подтверждённых дел пока нет.</div>`;
      const unconfirmedPayment = state.payments.find(payment =>
        payment.memberId === member.id && payment.status === "awaiting_child_confirmation"

      const unconfirmedSavings = state.savingsRequests.find(request =>
        request.memberId === member.id && request.status === "awaiting_child_confirmation"
      );
      const fund = fundForMember(member.id);
      const progress = accountProgresses(fund);
      return `
        <div class="dashboard-head">
          <div><p class="eyebrow">Привет, ${escapeHtml(member.name)}!</p><h1>Твои дела</h1></div>
          <div class="dashboard-actions">

              <span aria-hidden="true" style="font-size:22px;line-height:1">⚙</span>
            </button>
            <button type="button" class="button secondary small" id="switch-profile">Сменить профиль</button>
          </div>

              <div class="balance-label">Твой баланс</div>

            ${progress.map(item => `<div class="fund-progress"><div class="fund-progress-label"><span>${escapeHtml(item.label)}</span></div><div class="progress-track"><div class="progress-fill" style="width:${item.value}%"></div></div></div>`).join("")}
            ${unconfirmedPayment ? `<p class="payout-note">${money(unconfirmedPayment.amount)} · Выплата не подтверждена</p>` : ""}
            ${unconfirmedSavings ? `<p class="payout-note">${money(unconfirmedSavings.amount)} · Выплата из накоплений не подтверждена</p>` : ""}
            ${state.payments.some(payment => payment.memberId === member.id && payment.status === "requested") ? `<p class="payout-note">Запрос выплаты ожидает родителя</p>` : ""}

          </div>
          <div class="balance-icon" aria-hidden="true">${Number(fund.debtRemaining) > 0 ? "💳" : Number(fund.savingsTarget) > 0 ? "🌱" : "💰"}</div>

        <div class="section-heading"><h2>Мои отметки</h2></div>
        <div>${requestHistory}</div>
        <details class="history chores-history" id="chores-history" ${choreHistoryOpen ? "open" : ""}>
          <summary>История дел <span class="section-note">${approvedRequests.length}</span></summary>
          <div class="history-content">${confirmedHistory}</div>
        </details>
        ${renderPaymentHistory(member.id, false)}

          <div class="request-actions">

          </div>
        </article>
      `).join("") : `<div class="empty">Запросов на выплату пока нет.</div>`;
      const savingsPayoutHtml = savingsPayoutRequests.map(request => `
        <article class="request">
          <div>
            <div class="request-title">${escapeHtml(memberName(request.memberId))} · ${money(request.amount)} из накоплений</div>
            <div class="request-meta">${escapeHtml(formatTimestamp(request.createdAt))}</div>
            <div class="request-meta status">Запрошено снятие накоплений</div>

          <div class="request-actions">
            <button type="button" class="button small" data-pay-savings="${escapeHtml(request.id)}">Произвести оплату</button>
            <button type="button" class="button danger small" data-reject-savings="${escapeHtml(request.id)}">Отклонить</button>
          </div>
        </article>
      `).join("");
      const children = state.members.filter(item => item.role === "child").map(child => `
        <article class="member-card">
          <div class="member-details">
            <strong>${escapeHtml(child.name)}</strong>
            <span class="money-small">Накопления: ${money(fundForMember(child.id).savingsBalance)} · Долг: ${money(fundForMember(child.id).debtRemaining)}</span>
          </div>
          <div class="member-controls">
            <span class="member-balance">${money(memberBalance(child.id))}</span>
            ${Number(fundForMember(child.id).debtTarget) > 0 || Number(fundForMember(child.id).debtRemaining) > 0
              ? `<button type="button" class="button secondary small" data-manage-debt="${escapeHtml(child.id)}">Изменить долг</button>`

      const tasks = state.tasks.map(task => `
        <article class="member-card">
          <div><strong>${escapeHtml(task.title)}</strong><span class="member-role">${task.active ? "Доступно" : "Скрыто"} · ${task.visibleTo ? `Только для ${escapeHtml(memberName(task.visibleTo))}` : "Видят все дети"}</span></div>
          <div class="member-controls">
            <span class="member-balance">${money(task.price)}</span>
            <div class="task-controls">
              <button type="button" class="button secondary small" data-edit-task="${escapeHtml(task.id)}">Изменить</button>
              <button type="button" class="button danger small" data-delete-task="${escapeHtml(task.id)}">Удалить</button>
            </div>
          </div>
        </article>
      `).join("");
      return `
        <div class="dashboard-head">
          <div><p class="eyebrow">Родитель · ${escapeHtml(member.name)}</p><h1>Семейная панель</h1></div>
          <div class="dashboard-actions">
            <button type="button" class="icon-button" id="open-settings" aria-label="Настройки" title="Настройки">
              <span aria-hidden="true" style="font-size:22px;line-height:1">⚙</span>
            </button>
            <button type="button" class="button secondary small" id="switch-profile">Сменить профиль</button>
          </div>
        </div>
        ${!currentSessionToken ? `
          <section class="panel" style="margin-bottom:14px">
            <p class="intro">Общая Google-таблица нужна, чтобы дела, заявки, балансы и история были одинаковыми на устройствах родителей и детей. Подключение настраивает родитель.</p>
            <button type="button" class="button secondary small" id="cloud-connect">Подключить семейную базу</button>
          </section>
        ` : ""}
        <div class="section-heading"><h2>Баланс детей</h2></div>
        <div class="member-list">${children}</div>
        <div class="section-heading"><h2>Нужно проверить</h2><span class="section-note">${pending.length} заявок</span></div>
        <div class="request-list">${requestsHtml}</div>
        <div class="section-heading"><h2>Запросы на выплату</h2><span class="section-note">${payoutRequests.length + savingsPayoutRequests.length}</span></div>
        <div class="request-list">${payoutRequests.length ? payoutHtml : ""}${savingsPayoutHtml}${payoutRequests.length + savingsPayoutRequests.length ? "" : `<div class="empty">Запросов на выплату пока нет.</div>`}</div>
        ${renderPaymentHistory(member.id, true)}
        <div class="section-heading"><h2>Список дел</h2></div>
        <div class="member-list">${tasks}</div>
        <section class="panel" style="margin-top:14px">
          <h2>Добавить дело</h2>
          <form id="task-form">
            <div class="field"><label for="task-title">Название</label><input id="task-title" name="title" maxlength="60" placeholder="Например, вынести мусор" required></div>
            <div class="field"><label for="task-price">Цена, ₽</label><input id="task-price" name="price" type="number" min="0.01" max="100000" step="0.01" required></div>
            <div class="field"><label for="task-child">Кому видно</label><select id="task-child" name="visibleTo"><option value="">Всем детям</option>${state.members.filter(child => child.role === "child").map(child => `<option value="${escapeHtml(child.id)}">${escapeHtml(child.name)}</option>`).join("")}</select></div>
            <p class="error" id="form-error">${escapeHtml(notice)}</p>
            <div class="form-actions"><button class="button" type="submit">Добавить дело</button><button class="button secondary" type="button" id="add-member">Добавить участника</button></div>
          </form>
        </section>
      `;
    }

    function openParentAction(action) {
      pendingParentAction = action;
      modal = { type: "parent-pin" };
      render();
    }

    document.addEventListener("toggle", event => {
      if (event.target.id === "chores-history") choreHistoryOpen = event.target.open;
      if (event.target.id === "payment-history") paymentHistoryOpen = event.target.open;
    }, true);

    document.addEventListener("click", event => {
      const activeMember = state.members.find(item => item.id === currentMemberId);
      const paymentConfirmationRequired = activeMember?.role === "child" &&
        (state.payments.some(payment =>
          payment.memberId === activeMember.id && payment.status === "awaiting_child_confirmation"
        ) || state.savingsRequests.some(request =>
          request.memberId === activeMember.id && request.status === "awaiting_child_confirmation"
        ));
      if (paymentConfirmationRequired && !event.target.closest("#payment-confirmation-form")) return;

      if (event.target.closest("#cloud-connect")) {
        cloudLoginMode = true;
        selectedRole = "parent";
        notice = "";
        render();
        return;
      }

      if (event.target.closest("#offline-mode")) {
        window.clearInterval(cloudRefreshTimer);
        cloudLoginMode = false;
        currentSessionToken = "";
        currentMemberId = "";
        currentRole = "";
        currentServerVersion = 0;
        notice = "";
        render();
        return;
      }

      const roleButton = event.target.closest("[data-role]");
      if (roleButton) {
        selectedRole = roleButton.dataset.role;
        notice = "";
        render();
        return;
      }

      if (event.target.closest("#switch-profile")) {
        window.clearInterval(cloudRefreshTimer);
        currentSessionToken = "";
        currentRole = "";
        currentMemberId = "";
        modal = null;
        choreHistoryOpen = false;
        paymentHistoryOpen = false;
        notice = "";
        render();
        return;
      }

      if (event.target.closest("#open-settings")) {
        modal = { type: "settings" };
        render();
        return;
      }

      const editTaskButton = event.target.closest("[data-edit-task]");
      if (editTaskButton) {
        modal = { type: "edit-task", taskId: editTaskButton.dataset.editTask, error: "" };
        render();
        return;
      }

      const deleteTaskButton = event.target.closest("[data-delete-task]");
      if (deleteTaskButton) {
        modal = { type: "delete-task", taskId: deleteTaskButton.dataset.deleteTask, error: "" };
        render();
        return;
      }

      const themeOption = event.target.closest("[data-theme-option]");
      if (themeOption) {
        setTheme(themeOption.dataset.themeOption);
        render();
        return;
      }

      const fundAction = event.target.closest("[data-fund-action]");
      if (fundAction) {
        modal = { type: "fund-setup", mode: fundAction.dataset.fundAction, error: "" };
        render();
        return;
      }

      if (event.target.closest("[data-request-savings]")) {
        if (availableSavings(currentMemberId) <= 0) return;
        modal = { type: "savings-request", error: "" };
        render();
        return;
      }

      const manageDebtButton = event.target.closest("[data-manage-debt]");
      if (manageDebtButton) {
        modal = { type: "manage-debt", memberId: manageDebtButton.dataset.manageDebt, error: "" };
        render();
        return;
      }

      const paySavingsButton = event.target.closest("[data-pay-savings]");
      if (paySavingsButton) {
        modal = { type: "savings-pay", requestId: paySavingsButton.dataset.paySavings, error: "" };
        render();
        return;
      }

      const rejectSavingsButton = event.target.closest("[data-reject-savings]");
      if (rejectSavingsButton) {
        modal = { type: "savings-reject", requestId: rejectSavingsButton.dataset.rejectSavings, error: "" };
        render();
        return;
      }

      if (event.target.closest("#add-member")) {
        if (currentSessionToken && currentRole === "parent") {
          modal = { type: "member", error: "" };
          render();
          return;
        }
        currentMemberId = "";
        selectedRole = "";
        addingMember = true;
        modal = null;
        choreHistoryOpen = false;
        paymentHistoryOpen = false;
        notice = "";
        render();
        return;
      }

      if (event.target.closest("#copy-invite-code")) {
        const code = modal?.inviteCode;
        if (!code) return;
        navigator.clipboard.writeText(code).then(() => {
          notice = "Код скопирован.";
        }).catch(error => {
          console.error("Не удалось скопировать код.", error);
          notice = "Не удалось скопировать автоматически. Перепишите код вручную.";
        });
        return;
      }

      if (event.target.closest("[data-close-modal]")) {
        modal = null;
        pendingParentAction = null;
        render();
        return;
      }

      if (event.target.closest("[data-request-payout]")) {
        if (availableForPayout(currentMemberId) <= 0) return;
        modal = { type: "payout-request", error: "" };
        render();
        return;
      }

      const payRequestButton = event.target.closest("[data-pay-request]");
      if (payRequestButton) {
        const payment = state.payments.find(item =>
          item.id === payRequestButton.dataset.payRequest && item.status === "requested"
        );
        if (!payment) return;
        modal = { type: "pay-request", paymentId: payment.id, error: "" };
        render();
        return;
      }

      const deleteRequestButton = event.target.closest("[data-delete-request]");
      if (deleteRequestButton) {
        const request = state.requests.find(item =>
          item.id === deleteRequestButton.dataset.deleteRequest &&
          item.memberId === currentMemberId &&
          item.status === "pending"
        );
        if (!request) return;
        modal = { type: "delete-request", requestId: request.id };
        render();
        return;
      }

      const confirmDeleteButton = event.target.closest("[data-confirm-delete]");
      if (confirmDeleteButton) {
        const requestIndex = state.requests.findIndex(item =>
          item.id === confirmDeleteButton.dataset.confirmDelete &&
          item.memberId === currentMemberId &&
          item.status === "pending"
        );
        if (requestIndex === -1) return;
        state.requests.splice(requestIndex, 1);
        saveState();
        modal = null;
        render();
        return;
      }

      const taskButton = event.target.closest("[data-task-id]");
      if (taskButton) {
        const task = state.tasks.find(item => item.id === taskButton.dataset.taskId && item.active);
        if (!task) return;
        modal = { type: "task", taskId: task.id };
        render();
        return;
      }

      const reviewButton = event.target.closest("[data-review]");
      if (reviewButton) {
        const { review, requestId } = reviewButton.dataset;
        modal = { type: "review", requestId, status: review };
        render();
      }
    });

    document.addEventListener("submit", event => {
      const activeMember = state.members.find(item => item.id === currentMemberId);
      const paymentConfirmationRequired = activeMember?.role === "child" &&
        (state.payments.some(payment =>
          payment.memberId === activeMember.id && payment.status === "awaiting_child_confirmation"
        ) || state.savingsRequests.some(request =>
          request.memberId === activeMember.id && request.status === "awaiting_child_confirmation"
        ));
      if (paymentConfirmationRequired && event.target.id !== "payment-confirmation-form") {
        event.preventDefault();
        return;
      }

      if (event.target.id === "setup-form") {
        event.preventDefault();
        const name = new FormData(event.target).get("name").trim();
        const pin = new FormData(event.target).get("pin");
        if (!selectedRole) {
          notice = "Сначала выберите роль.";
          render();
          return;
        }
        if (state.members.filter(member => member.role === selectedRole).length >= 2) {
          notice = `В семье уже добавлены два участника с ролью «${selectedRole === "parent" ? "родитель" : "ребёнок"}».`;
          render();
          return;
        }
        if (!name) return;
        if (selectedRole === "parent" && addingMember && state.pin && pin !== state.pin) {
          notice = "PIN не подошёл.";
          render();
          return;
        }
        if (selectedRole === "parent" && !state.pin) {
          if (!/^\d{4}$/.test(pin)) {
            notice = "PIN должен состоять ровно из четырёх цифр.";
            render();
            return;
          }
          state.pin = pin;
        }
        addMember(name, selectedRole);
      }

      if (event.target.id === "cloud-login-form") {
        event.preventDefault();
        const form = new FormData(event.target);
        const name = String(form.get("name") || "").trim();
        const familyCode = String(form.get("familyCode") || "").trim();
        const pin = String(form.get("pin") || "");
        const inviteCode = String(form.get("inviteCode") || "").trim();
        if (!selectedRole) {
          notice = "Сначала выберите роль.";
          render();
          return;
        }
        if (selectedRole === "parent" && form.has("backendUrl")) {
          try {
            setBackendUrl(form.get("backendUrl"));
          } catch (error) {
            notice = error.message;
            render();
            return;
          }
        } else if (!backendUrl) {
          notice = "Попросите родителя подключить семейную базу на этом устройстве.";
          render();
          return;
        }
        notice = "Подключаемся к семейной базе…";
        render();
        apiCall(selectedRole === "parent" ? "parentLogin" : "childLogin", {
          familyCode,
          name,
          pin,
          inviteCode
        }).then(response => {
          currentSessionToken = response.token;
          currentMemberId = response.memberId;
          currentRole = response.role;
          currentServerVersion = response.version;
          state = { ...response.state, pin: null };
          localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
          startCloudRefresh();
          choreHistoryOpen = false;
          paymentHistoryOpen = false;
          notice = "";
          render();
        }).catch(error => {
          console.error("Не удалось войти в семейную Google-таблицу.", error);
          notice = error.message;
          render();
        });
      }

      if (event.target.id === "member-form") {
        event.preventDefault();
        const form = new FormData(event.target);
        const name = String(form.get("name") || "").trim();
        const role = String(form.get("role") || "");
        const pin = String(form.get("pin") || "");
        apiCall("addMember", { token: currentSessionToken, name, role, pin }).then(response => {
          state = { ...response.state, pin: null };
          currentServerVersion = response.version;
          localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
          modal = response.inviteCode
            ? { type: "invite-code", inviteCode: response.inviteCode }
            : null;
          notice = "";
          render();
        }).catch(error => {
          console.error("Не удалось добавить участника.", error);
          if (modal) modal.error = error.message;
          render();
        });
      }

      if (event.target.id === "login-form") {
        event.preventDefault();
        currentMemberId = new FormData(event.target).get("memberId");
        choreHistoryOpen = false;
        paymentHistoryOpen = false;
        notice = "";
        render();
      }

      if (event.target.id === "task-form") {
        event.preventDefault();
        const form = new FormData(event.target);
        const title = String(form.get("title")).trim();
        const price = Number(form.get("price"));
        const visibleTo = String(form.get("visibleTo") || "");
        if (!title || !Number.isFinite(price) || price <= 0) {
          notice = "Введите название и положительную цену.";
          render();
          return;
        }
        openParentAction(pin => {
          state.tasks.push({ id: crypto.randomUUID(), title: title.slice(0, 60), price, active: true, visibleTo });
          saveState(currentSessionToken ? pin : "");
          notice = "Дело добавлено.";
          render();
        });
      }

      if (event.target.id === "edit-task-form") {
        event.preventDefault();
        const form = new FormData(event.target);
        const title = String(form.get("title") || "").trim();
        const price = Number(form.get("price"));
        const visibleTo = String(form.get("visibleTo") || "");
        if (!title || title.length > 60 || !Number.isFinite(price) || price <= 0 || price > 100000) {
          modal.error = "Введите название до 60 символов и цену от 0,01 до 100 000 ₽.";
          render();
          return;
        }
        const taskId = modal.taskId;
        openParentAction(pin => {
          const task = state.tasks.find(item => item.id === taskId);
          if (!task) {
            notice = "Это дело уже удалено.";
            render();
            return;
          }
          task.title = title;
          task.price = Math.round(price * 100) / 100;
          task.visibleTo = visibleTo;
          modal = null;
          saveState(currentSessionToken ? pin : "");
          notice = "Изменения дела сохранены.";
          render();
        });
      }

      if (event.target.id === "delete-task-form") {
        event.preventDefault();
        const taskId = modal.taskId;
        openParentAction(pin => {
          const taskIndex = state.tasks.findIndex(item => item.id === taskId);
          if (taskIndex === -1) {
            notice = "Это дело уже удалено.";
            render();
            return;
          }
          state.tasks.splice(taskIndex, 1);
          modal = null;
          saveState(currentSessionToken ? pin : "");
          notice = "Дело удалено. История заявок сохранена.";
          render();
        });
      }

      if (event.target.id === "fund-setup-form") {
        event.preventDefault();
        const form = new FormData(event.target);
        const mode = String(form.get("mode") || "");
        const target = Number(form.get("target"));
        const percent = Number(form.get("percent"));
        const fund = fundForMember(currentMemberId);
        const maxPercent = mode === "savings" && Number(fund.debtRemaining) > 0 ? 20 : 50;
        const minTarget = mode === "savings" ? Math.max(0.01, Number(fund.savingsBalance)) : 0.01;
        if ((mode !== "savings" && mode !== "debt") || !Number.isFinite(target) ||
            target < minTarget || target > 100000 || !Number.isFinite(percent) ||
            percent < 0 || percent > maxPercent) {
          modal.error = `Проверьте сумму и процент (не более ${maxPercent}%).`;
          render();
          return;
        }
        if (mode === "debt") {
          if (Number(fund.debtRemaining) > 0) {
            modal.error = "Изменить или отменить долг может только родитель.";
            render();
            return;
          }
          fund.debtRate = percent;
          fund.debtRemaining = Math.round(target * 100) / 100;
          fund.debtTarget = Math.round((target + Number(fund.debtPaidTotal)) * 100) / 100;
          fund.savingsRate = Math.min(Number(fund.savingsRate), 20);
        } else {
          fund.savingsTarget = Math.round(target * 100) / 100;
          fund.savingsRate = percent;
        }
        modal = null;
        saveState();
        render();
      }

      if (event.target.id === "manage-debt-form") {
        event.preventDefault();
        const form = new FormData(event.target);
        const amount = Number(form.get("amount"));
        const pin = String(form.get("pin") || "");
        if (!Number.isFinite(amount) || amount < 0 || amount > 100000) {
          modal.error = "Введите остаток долга от 0 до 100 000 ₽.";
          render();
          return;
        }
        verifyParentPin(pin).then(() => {
          const fund = fundForMember(modal.memberId);
          const remaining = Math.round(amount * 100) / 100;
          fund.debtRemaining = remaining;
          fund.debtTarget = remaining > 0
            ? Math.round((remaining + Number(fund.debtPaidTotal)) * 100) / 100
            : 0;
          if (remaining > 0) fund.savingsRate = Math.min(Number(fund.savingsRate), 20);
          modal = null;
          saveState(currentSessionToken ? pin : "");
          render();
        }).catch(error => {
          if (modal) modal.error = error.message;
          render();
        });
      }

      if (event.target.id === "savings-request-form") {
        event.preventDefault();
        const amount = Number(new FormData(event.target).get("amount"));
        const maximum = availableSavings(currentMemberId);
        const amountInCents = Math.round(amount * 100);
        if (!Number.isFinite(amount) || amountInCents < 1 ||
            amountInCents > Math.round(maximum * 100)) {
          modal.error = `Введите сумму от 0,01 до ${money(maximum)}.`;
          render();
          return;
        }
        state.savingsRequests.push({
          id: crypto.randomUUID(),
          memberId: currentMemberId,
          amount: amountInCents / 100,
          status: "requested",
          createdAt: new Date().toISOString(),
          paidAt: "",
          confirmedAt: ""
        });
        modal = null;
        paymentHistoryOpen = false;
        saveState();
        render();
      }

      if (event.target.id === "request-form") {
        event.preventDefault();
        const comment = String(new FormData(event.target).get("comment") || "").trim().slice(0, 500);
        const task = state.tasks.find(item =>
          item.id === modal?.taskId && item.active && (!item.visibleTo || item.visibleTo === currentMemberId)
        );
        if (!task) {
          modal = null;
          render();
          return;
        }
        state.requests.push({
          id: crypto.randomUUID(),
          memberId: currentMemberId,
          taskId: task.id,
          taskTitle: task.title,
          price: Number(task.price),
          comment,
          createdAt: new Date().toISOString(),
          status: "pending",
          parentComment: ""
        });
        modal = null;
        saveState();
        render();
      }

      if (event.target.id === "review-form") {
        event.preventDefault();
        const form = new FormData(event.target);
        const pin = String(form.get("pin") || "");
        verifyParentPin(pin).then(() => {
          const request = state.requests.find(item => item.id === modal.requestId && item.status === "pending");
          if (request) {
            if (modal.status === "approved" && !currentSessionToken) {
              applyChoreAllocation(request.memberId, request.price);
            }
            request.status = modal.status;
            request.parentComment = String(form.get("parentComment") || "").trim().slice(0, 500);
            saveState(currentSessionToken ? pin : "");
          }
          modal = null;
          notice = "";
          render();
        }).catch(error => {
          if (modal) modal.error = error.message;
          render();
        });
      }

      if (event.target.id === "parent-pin-form") {
        event.preventDefault();
        const pin = new FormData(event.target).get("pin");
        const action = pendingParentAction;
        verifyParentPin(pin).then(() => {
          pendingParentAction = null;
          modal = null;
          if (action) action(pin);
          render();
        }).catch(error => {
          modal.error = `${error.message} Попробуйте ещё раз.`;
          render();
        });
      }

      if (event.target.id === "payout-request-form") {
        event.preventDefault();
        const amount = Number(new FormData(event.target).get("amount"));
        const maximum = availableForPayout(currentMemberId);
        const amountInCents = Math.round(amount * 100);
        if (!Number.isFinite(amount) || amountInCents < 1 || amountInCents > Math.round(maximum * 100)) {
          modal.error = `Введите сумму от 0,01 до ${money(maximum)}.`;
          render();
          return;
        }
        state.payments.push({
          id: crypto.randomUUID(),
          memberId: currentMemberId,
          amount: amountInCents / 100,
          status: "requested",
          createdAt: new Date().toISOString(),
          paidAt: "",
          confirmedAt: ""
        });
        modal = null;
        paymentHistoryOpen = false;
        saveState();
        render();
      }

      if (event.target.id === "pay-request-form") {
        event.preventDefault();
        const form = new FormData(event.target);
        const payment = state.payments.find(item =>
          item.id === modal.paymentId && item.status === "requested"
        );
        if (!payment) {
          modal = null;
          render();
          return;
        }
        const otherReserved = state.payments
          .filter(item => item.memberId === payment.memberId && item.status === "requested" && item.id !== payment.id)
          .reduce((sum, item) => sum + Math.round(Number(item.amount) * 100), 0);
        const payable = Math.round(memberBalance(payment.memberId) * 100) - otherReserved;
        if (Math.round(payment.amount * 100) > payable) {
          modal.error = "На балансе недостаточно средств для этой выплаты.";
          render();
          return;
        }
        const pin = String(form.get("pin") || "");
        verifyParentPin(pin).then(() => {
          payment.status = "awaiting_child_confirmation";
          payment.paidAt = new Date().toISOString();
          modal = null;
          saveState(currentSessionToken ? pin : "");
          render();
        }).catch(error => {
          if (modal) modal.error = error.message;
          render();
        });
      }

      if (event.target.id === "savings-pay-form") {
        event.preventDefault();
        const pin = String(new FormData(event.target).get("pin") || "");
        const request = state.savingsRequests.find(item =>
          item.id === modal.requestId && item.status === "requested"
        );
        if (!request) {
          modal = null;
          render();
          return;
        }
        verifyParentPin(pin).then(() => {
          request.status = "awaiting_child_confirmation";
          request.paidAt = new Date().toISOString();
          modal = null;
          saveState(currentSessionToken ? pin : "");
          render();
        }).catch(error => {
          if (modal) modal.error = error.message;
          render();
        });
      }

      if (event.target.id === "savings-reject-form") {
        event.preventDefault();
        const pin = String(new FormData(event.target).get("pin") || "");
        const request = state.savingsRequests.find(item =>
          item.id === modal.requestId && item.status === "requested"
        );
        if (!request) {
          modal = null;
          render();
          return;
        }
        verifyParentPin(pin).then(() => {
          request.status = "rejected";
          modal = null;
          saveState(currentSessionToken ? pin : "");
          render();
        }).catch(error => {
          if (modal) modal.error = error.message;
          render();
        });
      }

      if (event.target.id === "payment-confirmation-form") {
        event.preventDefault();
        const form = new FormData(event.target);
        const isSavings = form.get("kind") === "savings";
        const id = String(form.get("requestId") || "");
        const request = isSavings
          ? state.savingsRequests.find(item => item.id === id && item.memberId === currentMemberId && item.status === "awaiting_child_confirmation")
          : state.payments.find(item => item.id === id && item.memberId === currentMemberId && item.status === "awaiting_child_confirmation");
        if (!request) return;
        request.status = "confirmed";
        request.confirmedAt = new Date().toISOString();
        if (isSavings && !currentSessionToken) {
          const fund = fundForMember(currentMemberId);
          fund.savingsBalance = Math.max(0, Math.round((Number(fund.savingsBalance) - Number(request.amount)) * 100) / 100);
          fund.savingsWithdrawn = Math.round((Number(fund.savingsWithdrawn) + Number(request.amount)) * 100) / 100;
        }
        saveState();
        render();
      }
    });

    function addMember(name, role) {
      if (state.members.filter(member => member.role === role).length >= 2) {
        notice = `В семье уже добавлены два участника с ролью «${role === "parent" ? "родитель" : "ребёнок"}».`;
        render();
        return;
      }
      const member = { id: crypto.randomUUID(), name: name.trim().slice(0, 40), role };
      state.members.push(member);
      if (role === "child") state.funds.push(emptyFund(member.id));
      saveState();
      currentMemberId = member.id;
      selectedRole = "";
      addingMember = false;
      notice = "";
      render();
    }

    if ("serviceWorker" in navigator && location.protocol !== "file:") {
      window.addEventListener("load", () => {
        navigator.serviceWorker.register("./sw.js", { updateViaCache: "none" }).catch(error => {
          console.error("Не удалось зарегистрировать service worker.", error);
        });
      });
    }

    applyTheme(selectedTheme);
    render();
  </script>
</body>
</html>
